<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Renz Rap Auto Supply — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:       #0e2254;
      --navy-dark:  #09183d;
      --navy-mid:   #163070;
      --cyan:       #00d4ff;
      --cyan-dim:   #00b4d8;
      --bg:         #eef1f8;
      --white:      #ffffff;
      --text:       #0a192f;
      --muted:      #6b7a94;
      --border:     #d0d4df;
      --input-bg:   #f4f6fb;
    }

    [data-theme="dark"] {
      --navy:       #0f172a;
      --navy-light: #1e293b;
      --navy-dark:  #09183d;
      --navy-mid:   #0f172a;
      --blue-btn:   #1e40af;
      --cyan:       #22d3ee;
      --cyan-dim:   #0891b2;
      --bg:         #0f172a;
      --pos-bg:     #0f172a;
      --cart-bg:    #1e293b;
      --card-bg:    #1e293b;
      --border:     #334155;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --input-bg:   #1e293b;
      --white:      #1e293b;
      --green:      #22c55e;
      --green-bg:   #052e16;
      --green-bd:   #166534;
      --red:        #ef4444;
      --red-bg:     #450a0a;
      --red-bd:     #7f1d1d;
      --red-hover:  #7f1d1d;
      --yellow:     #eab308;
      --yellow-bg:  #422006;
      --yellow-bd:  #713f12;
      --success:    #10b981;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 40%, #80deea 100%);
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }

    /* ── CARD ─────────────────────────────────────────── */
    .card {
      display: flex;
      width: 100%;
      max-width: 780px;
      min-height: 500px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 24px 64px rgba(14,34,84,0.18),
        0 4px 16px  rgba(0,0,0,0.08);
      animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes rise {
      from { opacity:0; transform:translateY(28px) scale(0.98); }
      to   { opacity:1; transform:translateY(0)    scale(1);    }
    }

    /* ── LEFT PANEL ───────────────────────────────────── */
    .panel-brand {
      width: 260px;
      flex-shrink: 0;
      background: var(--navy);
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      overflow: hidden;
    }

    /* dot-grid texture */
    .panel-brand::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* top-right glow */
    .glow-top {
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(0,212,255,0.13);
      top: -60px; right: -70px;
      filter: blur(50px);
      pointer-events: none;
    }

    /* bottom-left glow */
    .glow-bot {
      position: absolute;
      width: 130px; height: 130px;
      border-radius: 50%;
      background: rgba(0,212,255,0.07);
      bottom: -30px; left: -30px;
      filter: blur(36px);
      pointer-events: none;
    }

    .brand-dots {
      display: flex;
      gap: 5px;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
      animation: fade-up 0.5s 0.3s both;
    }
    .brand-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
    }
    .brand-dot.active {
      width: 16px;
      border-radius: 99px;
      background: var(--cyan);
    }

    .brand-logo {
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
      animation: fade-up 0.5s 0.38s both;
    }
    .brand-logo img {
      width: 100%;
      max-width: 196px;
      display: block;
    }

    .brand-line {
      width: 28px; height: 2px;
      background: rgba(0,212,255,0.55);
      border-radius: 2px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      animation: fade-up 0.5s 0.45s both;
    }

    .brand-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.38);
      line-height: 1.6;
      position: relative;
      z-index: 1;
      animation: fade-up 0.5s 0.5s both;
    }

    @keyframes fade-up {
      from { opacity:0; transform:translateY(12px); }
      to   { opacity:1; transform:translateY(0);    }
    }

    /* ── RIGHT PANEL ──────────────────────────────────── */
    .panel-form {
      flex: 1;
      background: var(--white);
      padding: 52px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: #0e2254;
      margin-bottom: 5px;
      animation: fade-up 0.5s 0.4s both;
    }

    .form-hint {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 34px;
      animation: fade-up 0.5s 0.45s both;
    }
    /* ── LOGO TEXT ───────────────────────────────────────── */
      .brand-name-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 32px;
        color: #22d3ee;        /* ← cyan for Renz Rap */
        margin-top: 14px;
        line-height: 1.25;
        position: relative;
        z-index: 1;
      }
      .brand-name-text span {
        font-size: 24px;
        font-weight: 600;
        color: #ffffff;        /* ← white for Auto Supply */
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }

    /* ── BANNER ───────────────────────────────────────── */
    .banner {
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      display: none;
    }
    .banner.show   { display: block; animation: fade-in 0.22s ease; }
    .banner.error  { background:#fff1f0; border:1px solid #ffc4c0; color:#c0392b; }
    .banner.success{ background:#f0fff4; border:1px solid #b9f0cc; color:#1a7a3c; }

    @keyframes fade-in {
      from { opacity:0; transform:translateY(-5px); }
      to   { opacity:1; transform:none;             }
    }

    /* ── SUCCESS OVERLAY ─────────────────────────────────── */
    #successOverlay {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(255,255,255,0.85); backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center;
      z-index:20000; opacity:0; visibility:hidden;
      transition:opacity 0.3s, visibility 0.3s;
    }
    #successOverlay.show { opacity:1; visibility:visible; }
    #successOverlay .inner {
      display:flex; flex-direction:column; align-items:center; gap:18px;
    }
    #successOverlay svg {
      width: 100px; height: 100px;
    }
    #successOverlay circle {
      fill: none; stroke: #16a34a; stroke-width: 4; stroke-linecap: round;
      stroke-dasharray: 290; stroke-dashoffset: 290;
      animation: circle-draw 0.5s ease forwards;
    }
    #successOverlay path {
      fill: none; stroke: #16a34a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 80; stroke-dashoffset: 80;
      animation: check-draw 0.35s 0.5s ease forwards;
    }
    @keyframes circle-draw { to { stroke-dashoffset: 0; } }
    @keyframes check-draw  { to { stroke-dashoffset: 0; } }

    #successOverlay .login-success-text {
      font-family: 'Barlow', sans-serif; font-size: 22px; font-weight: 700;
      color: #16a34a; opacity:0; animation: fade-in 0.4s 0.7s ease forwards;
    }
    @keyframes fade-in { to { opacity:1; } }

    /* ── FIELDS ───────────────────────────────────────── */
    .field {
      margin-bottom: 18px;
      animation: fade-up 0.5s 0.5s both;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.55px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
    }
    .input-wrap:focus-within {
      border-color: var(--cyan-dim);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0,180,216,0.12);
    }

    .input-icon {
      display: flex;
      align-items: center;
      padding: 0 13px;
      color: var(--muted);
    }
    .input-icon svg {
      width: 17px; height: 17px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 13px 14px 13px 0;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }
    .input-wrap input::placeholder { color: #b8c0d0; }

    /* ── BUTTON ───────────────────────────────────────── */
    .btn-login {
      width: 100%;
      height: 50px;
      border-radius: 11px;
      border: none;
      background: var(--navy);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(14,34,84,0.30);
      animation: fade-up 0.5s 0.6s both;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,212,255,0.14), transparent 60%);
      pointer-events: none;
    }
    .btn-login svg {
      width: 17px; height: 17px;
      stroke: var(--cyan);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn-login:hover  { background: var(--navy-mid); transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0) scale(0.99); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .form-footer {
      margin-top: 20px;
      font-size: 11.5px;
      color: var(--muted);
      text-align: center;
      animation: fade-up 0.5s 0.65s both;
    }
    .form-footer a { color: var(--cyan-dim); text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    /* ── SHAKE ────────────────────────────────────────── */
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .shake { animation: shake 0.4s ease !important; }

    /* ── RESPONSIVE ───────────────────────────────────── */
    @media (max-width: 600px) {
      .card        { flex-direction: column; min-height: auto; }
      .panel-brand { width: 100%; min-height: 160px; padding: 28px 28px 24px; flex-direction: row; align-items: center; justify-content: flex-start; gap: 20px; }
      .brand-dots  { display: none; }
      .brand-logo img { max-width: 150px; }
      .brand-line, .brand-sub { display: none; }
      .panel-form  { padding: 36px 28px 44px; }
    }
  </style>
</head>
<body>

<div class="card" id="card">

  <!-- ── LEFT: Brand ─────────────────────────────────── -->
  <div class="panel-brand">
    <div class="glow-top"></div>
    <div class="glow-bot"></div>

    <div class="brand-dots">
      <div class="brand-dot active"></div>
      <div class="brand-dot"></div>
      <div class="brand-dot"></div>
    </div>

    <div class="brand-logo">
    <img src="{{ url_for('static', filename='images/logo_renzrap.png') }}" alt="Renz Rap Auto Supply"/>
    <p class="brand-name-text">Renz Rap<br><span>Auto Supply</span></p>
  </div>

    <div class="brand-line"></div>
    <p class="brand-sub">Your trusted auto<br>parts partner</p>
  </div>

  <!-- ── RIGHT: Form ─────────────────────────────────── -->
  <div class="panel-form">

    <!-- ── Login View ── -->
    <div id="loginView">
      <h2 class="form-title">Welcome Back!</h2>
      <p class="form-hint">Sign in to continue to your dashboard</p>

      <div class="banner error"   id="errorBanner"></div>
      <div class="banner success" id="successBanner"></div>

      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" maxlength="8"/>
        </div>
      </div>

      <button class="btn-login" id="loginBtn" onclick="handleLogin()">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Sign in
      </button>

      <p class="form-footer"><a href="#" onclick="showForgotView(event)" style="color:var(--cyan-dim);text-decoration:none;font-weight:600;">Forgot Password?</a> &middot; <a href="#" style="color:var(--muted);">Contact admin</a></p>
    </div>

    <!-- ── Forgot Password View ── -->
    <div id="forgotView" style="display:none;">
      <h2 class="form-title">Reset Password</h2>
      <p class="form-hint">Request a code from your admin to reset</p>

      <div class="banner error"   id="forgotErrorBanner"></div>
      <div class="banner success" id="forgotSuccessBanner"></div>

      <div class="field" id="forgotStep1">
        <label for="forgotUsername">Username</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </span>
          <input type="text" id="forgotUsername" placeholder="Enter your username"/>
        </div>
      </div>

      <div id="forgotStep2" style="margin-top:18px;">
        <div class="field">
          <label for="resetCode">Reset Code</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="text" id="resetCode" placeholder="6-digit code" maxlength="6"/>
          </div>
        </div>
        <div class="field">
          <label for="newPassword">New Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </span>
            <input type="password" id="newPassword" placeholder="Max 8 characters" maxlength="8"/>
          </div>
        </div>
        <button class="btn-login" id="resetBtn" onclick="handleResetPassword()" style="animation:none;">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Reset Password
        </button>

        <button class="btn-login" id="requestBtn" onclick="handleRequestReset()" style="animation:none;margin-top:10px;background:#1e3a8a;box-shadow:0 4px 20px rgba(59,130,246,0.3);">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          Request Reset Code (if you don't have one)
        </button>
      </div>

      <p class="form-footer"><a href="#" onclick="showLoginView(event)" style="color:var(--cyan-dim);text-decoration:none;font-weight:600;">&larr; Back to Sign In</a></p>
    </div>

  </div>

</div>

<script>
  async function handleLogin() {
    const username   = document.getElementById('username').value.trim();
    const password   = document.getElementById('password').value;
    const btn        = document.getElementById('loginBtn');
    const errBanner  = document.getElementById('errorBanner');
    const okBanner   = document.getElementById('successBanner');

    errBanner.classList.remove('show');
    okBanner.classList.remove('show');

    if (!username || !password) {
      showError('Please enter both username and password.');
      return;
    }

    btn.disabled     = true;
    btn.innerHTML    = '<svg viewBox="0 0 24 24" style="stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:17px;height:17px"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Verifying…';

    try {
      const res  = await fetch('/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('successOverlay').classList.add('show');
        btn.innerHTML = '✓ Success';
        setTimeout(() => { window.location.href = '/dashboard'; }, 1200);
      } else {
        btn.disabled  = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" style="stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:17px;height:17px"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Sign in';
        showError(data.message || 'Invalid credentials.');
        shake();
      }
    } catch (err) {
      btn.disabled  = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" style="stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;width:17px;height:17px"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Sign in';
      showError('Network error. Please try again.');
      shake();
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorBanner');
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
  }

  function shake() {
    const card = document.getElementById('card');
    card.classList.add('shake');
    card.addEventListener('animationend', () => card.classList.remove('shake'), { once: true });
  }

  function showForgotView(e) {
    e.preventDefault();
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('forgotView').style.display = 'block';
    document.getElementById('forgotErrorBanner').classList.remove('show');
    document.getElementById('forgotSuccessBanner').classList.remove('show');
    document.getElementById('requestBtn').style.display = '';
  }

  function showLoginView(e) {
    e.preventDefault();
    document.getElementById('forgotView').style.display = 'none';
    document.getElementById('loginView').style.display = '';
  }

  function showForgotError(msg) {
    const el = document.getElementById('forgotErrorBanner');
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
  }

  function showForgotSuccess(msg) {
    const el = document.getElementById('forgotSuccessBanner');
    el.textContent = '✅ ' + msg;
    el.classList.add('show');
  }

  async function handleRequestReset() {
    const username = document.getElementById('forgotUsername').value.trim();
    const btn = document.getElementById('requestBtn');
    document.getElementById('forgotErrorBanner').classList.remove('show');
    document.getElementById('forgotSuccessBanner').classList.remove('show');

    if (!username) { showForgotError('Please enter your username.'); return; }

    btn.disabled = true;
    btn.innerHTML = '⏳ Requesting…';

    try {
      const res = await fetch('/api/forgot-password/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      });
      const data = await res.json();
      if (data.success) {
        showForgotSuccess('Reset code sent to admins!');
        btn.style.display = 'none';
      } else {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Request Reset Code';
        showForgotError(data.message || 'Something went wrong.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Request Reset Code';
      showForgotError('Network error. Please try again.');
    }
  }

  async function handleResetPassword() {
    const username = document.getElementById('forgotUsername').value.trim();
    const code = document.getElementById('resetCode').value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const btn = document.getElementById('resetBtn');
    document.getElementById('forgotErrorBanner').classList.remove('show');
    document.getElementById('forgotSuccessBanner').classList.remove('show');

    if (!code || !newPassword) { showForgotError('Please fill in all fields.'); return; }
    if (newPassword.length > 8) { showForgotError('Password must be 8 characters or less.'); return; }

    btn.disabled = true;
    btn.innerHTML = '⏳ Resetting…';

    try {
      const res = await fetch('/api/forgot-password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, code, new_password: newPassword })
      });
      const data = await res.json();
      if (data.success) {
        showForgotSuccess('Password updated! Redirecting to login…');
        setTimeout(() => { showLoginView({ preventDefault() {} }); }, 1500);
      } else {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Reset Password';
        showForgotError(data.message || 'Invalid code.');
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Reset Password';
      showForgotError('Network error. Please try again.');
    }
  }

  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>

<div id="successOverlay">
  <div class="inner">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44"/>
      <path d="M30 52l12 12 28-28"/>
    </svg>
    <div class="login-success-text">Login Successfully</div>
  </div>
</div>

</body>
</html>
