<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:      #005fa3;
      --blue-dark: #004a80;
      --blue-deep: #003560;
      --bg:        #e8ecf4;
      --input-bg:  #f0f2f8;
      --border:    #d0d4df;
      --text:      #0a192f;
      --muted:     #6b7a94;
      --white:     #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(0,95,163,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 110%, rgba(0,53,96,0.10) 0%, transparent 55%);
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
    }

    .card {
      display: flex;
      width: 100%;
      max-width: 860px;
      min-height: 520px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.16), 0 4px 16px rgba(0,0,0,0.08);
      animation: rise 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* LEFT PANEL */
    .panel-brand {
      flex: 1;
      background: linear-gradient(145deg, var(--blue) 0%, var(--blue-deep) 100%);
      padding: 60px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .panel-brand::before {
      content: '';
      position: absolute;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -80px; right: -100px;
    }
    .panel-brand::after {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: -60px; left: -60px;
    }

    .brand-icon  { font-size: 40px; margin-bottom: 28px; animation: pop 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
    .brand-name  { font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.15; color: var(--white); letter-spacing: -0.5px; animation: fade-up 0.5s 0.35s both; }
    .brand-sub   { margin-top: 14px; font-size: 14px; color: rgba(255,255,255,0.65); animation: fade-up 0.5s 0.45s both; }
    .brand-line  { width: 40px; height: 3px; background: rgba(255,255,255,0.35); border-radius: 2px; margin-top: 28px; animation: fade-up 0.5s 0.5s both; }

    @keyframes pop      { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
    @keyframes fade-up  { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

    /* RIGHT PANEL */
    .panel-form {
      flex: 1;
      background: var(--white);
      padding: 60px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-title { font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); margin-bottom: 6px; animation: fade-up 0.5s 0.4s both; }
    .form-hint  { font-size: 13px; color: var(--muted); margin-bottom: 36px; animation: fade-up 0.5s 0.45s both; }

    .field { margin-bottom: 20px; animation: fade-up 0.5s 0.5s both; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; letter-spacing: 0.6px; text-transform: uppercase; }
    .field input {
      width: 100%; height: 50px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--input-bg);
      padding: 0 18px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .field input:focus { border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgba(0,95,163,0.12); }
    .field input::placeholder { color: #b0b8c9; }

    .btn-login {
      width: 100%; height: 52px;
      border-radius: 14px; border: none;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: var(--white);
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 16px;
      cursor: pointer; margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 18px rgba(0,95,163,0.35);
      animation: fade-up 0.5s 0.65s both;
    }
    .btn-login:hover  { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(0,95,163,0.42); filter: brightness(1.08); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .banner {
      border-radius: 12px; padding: 12px 16px;
      font-size: 13px; font-weight: 500;
      margin-bottom: 18px; display: none;
      animation: fade-in 0.25s ease;
    }
    @keyframes fade-in { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    .banner.error   { background: #fff1f0; border: 1px solid #ffc4c0; color: #c0392b; }
    .banner.success { background: #f0fff4; border: 1px solid #b9f0cc; color: #1a7a3c; }
    .banner.show    { display: block; }

    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}   60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }
    .shake { animation: shake 0.4s ease !important; }

    @media (max-width: 640px) {
      .card { flex-direction: column; min-height: auto; }
      .panel-brand { padding: 40px 32px 32px; min-height: 180px; }
      .brand-name  { font-size: 32px; }
      .panel-form  { padding: 36px 32px 48px; }
    }
  </style>
</head>
<body>
<div class="card" id="card">

  <!-- LEFT: Brand -->
  <div class="panel-brand">
    <div class="brand-icon">🚗</div>
    <h1 class="brand-name">Renz Rap<br>Auto Supply</h1>
    <p class="brand-sub">Your trusted auto parts partner</p>
    <div class="brand-line"></div>
  </div>

  <!-- RIGHT: Form -->
  <div class="panel-form">
    <h2 class="form-title">Welcome back</h2>
    <p class="form-hint">Sign in to your account to continue</p>

    <div class="banner error"   id="errorBanner"></div>
    <div class="banner success" id="successBanner"></div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleLogin()">Login</button>
  </div>
</div>

<script>
  async function handleLogin() {
    const username    = document.getElementById("username").value.trim();
    const password    = document.getElementById("password").value;
    const btn         = document.getElementById("loginBtn");
    const errBanner   = document.getElementById("errorBanner");
    const okBanner    = document.getElementById("successBanner");

    errBanner.classList.remove("show");
    okBanner.classList.remove("show");

    if (!username || !password) {
      showError("Please enter both username and password.");
      return;
    }

    btn.disabled    = true;
    btn.textContent = "Verifying…";

    // Send credentials to Flask backend
    const res  = await fetch("/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (data.success) {
      okBanner.textContent = "✅ Login successful! Redirecting…";
      okBanner.classList.add("show");
      btn.textContent = "Login";
      setTimeout(() => { window.location.href = "/dashboard"; }, 1000);
    } else {
      btn.disabled    = false;
      btn.textContent = "Login";
      showError(data.message || "Invalid credentials.");
      const card = document.getElementById("card");
      card.classList.add("shake");
      card.addEventListener("animationend", () => card.classList.remove("shake"), { once: true });
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorBanner");
    el.textContent = "⚠️ " + msg;
    el.classList.add("show");
  }

  document.addEventListener("keydown", e => { if (e.key === "Enter") handleLogin(); });
</script>
</body>
</html>
