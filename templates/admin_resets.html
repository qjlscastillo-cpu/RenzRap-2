<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Resets | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1e3a8a; --blue-btn: #0056b3; --cyan: #00d4ff;
      --bg: #ffffff; --card-bg: #f8fafc; --border: #e5e7eb;
      --text: #111827; --muted: #6b7280; --white: #ffffff;
      --red: #dc2626; --red-bg: #fef2f2; --red-bd: #fecaca;
      --green: #16a34a; --green-bg: #f0fdf4; --green-bd: #bbf7d0;
    }

    [data-theme="dark"] {
      --navy:       #0f172a;
      --navy-light: #1e293b;
      --navy-dark:  #09183d;
      --navy-mid:   #0f172a;
      --blue-btn:   #1e40af;
      --cyan:       #22d3ee;
      --cyan-dim:   #0891b2;
      --bg:         #0f172a;
      --pos-bg:     #0f172a;
      --cart-bg:    #1e293b;
      --card-bg:    #1e293b;
      --border:     #334155;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --input-bg:   #1e293b;
      --white:      #1e293b;
      --green:      #22c55e;
      --green-bg:   #052e16;
      --green-bd:   #166534;
      --red:        #ef4444;
      --red-bg:     #450a0a;
      --red-bd:     #7f1d1d;
      --red-hover:  #7f1d1d;
      --yellow:     #eab308;
      --yellow-bg:  #422006;
      --yellow-bd:  #713f12;
      --success:    #10b981;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .shell { display: flex; width: 100vw; height: 100vh; overflow: hidden; }

    .sidebar { width: 220px; min-width: 220px; background: var(--navy); padding: 28px 16px; display: flex; flex-direction: column; overflow-y: auto; }
    .sidebar-logo { font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 17px; color: var(--white); margin-bottom: 20px; text-align: center; line-height: 1.3; }
    .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 42px; border-radius: 8px; border: 1px solid transparent; background: var(--white); color: var(--navy); font-weight: 600; font-size: 14px; padding: 0 14px; cursor: pointer; margin-bottom: 8px; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s; }
    .nav-item:hover { background: #e8f0fb; border: 1px solid var(--blue-btn); transform: translateY(0.5px); box-shadow: 0 4px 12px rgba(91,155,213,0.3); }
    .nav-item.active { background: var(--blue-btn); color: var(--white); border: 2px solid var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.5); cursor: default; }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }
    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }

    .main { flex: 1; background: var(--white); padding: 28px 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

    .page-title {
      font-family: 'Barlow', sans-serif; font-size: 24px; font-weight: 800;
      padding: 14px 20px;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e3a8a 100%);
      color: #fff; border-radius: 14px;
      box-shadow: 0 4px 16px rgba(30,58,138,0.2);
    }

    .table-card {
      background: var(--card-bg); border: 2px solid var(--border);
      border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 0;
    }
    .table-header {
      padding: 14px 18px; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 15px;
      color: var(--white); border-bottom: 1px solid var(--border);
      background: var(--navy); flex-shrink: 0; letter-spacing: 0.5px;
    }
    .table-scroll { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: #f1f5f9; padding: 12px 14px; text-align: left;
      font-weight: 900; -webkit-text-stroke: 0.5px var(--navy); color: var(--navy);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
      position: sticky; top: 0; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 11px 14px; color: var(--text); vertical-align: middle; }
    tbody tr:hover { background: #eff6ff; }
    .empty-row td { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

    .btn-action {
      display: inline-flex; align-items: center; justify-content: center;
      height: 30px; padding: 0 12px; border-radius: 6px; border: none;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12px;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
      gap: 4px;
    }
    .btn-action:hover { transform: translateY(-1px); }
    .btn-action.red { background: #ef4444; color: var(--white); }
    .btn-action.red:hover { background: #dc2626; }

    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .badge.pending { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
    [data-theme="dark"] #resetTable tbody tr:hover { background: rgba(59,130,246,0.08) !important; }
  </style>
</head>
<body>

<div class="shell">
  {% include "sidebar.html" %}
  <main class="main">

    
    <div class="table-card">
      <div class="table-header">Pending Requests</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Name</th>
              <th>Reset Code</th>
              <th>Requested</th>
              <th style="text-align:center">Actions</th>
            </tr>
          </thead>
          <tbody id="resetsBody">
            <tr class="empty-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<script>
  async function loadResets() {
    const res = await fetch("/api/forgot-password/pending");
    const data = await res.json();
    const tbody = document.getElementById("resetsBody");
    if (!data.length) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No pending password reset requests.</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(r => `<tr>
      <td><strong>${r.username}</strong></td>
      <td>${r.name || '—'}</td>
      <td style="font-family:monospace;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--navy);">${r.reset_code}</td>
      <td style="font-size:12px;color:var(--muted);">${r.created_at}</td>
      <td style="text-align:center">
        <button class="btn-action red" onclick="deleteReset(${r.id})"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Delete</button>
      </td>
    </tr>`).join("");
  }

  async function deleteReset(id) {
    if (!confirm("Delete this reset request?")) return;
    const res = await fetch(`/api/forgot-password/${id}`, { method: "DELETE" });
    if (res.ok) loadResets();
  }

  loadResets();
</script>
</body>
</html>
