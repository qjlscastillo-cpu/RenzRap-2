<style>
  #logoutOverlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; visibility: hidden;
    transition: opacity 0.2s, visibility 0.2s;
  }
  #logoutOverlay.open { opacity: 1; visibility: visible; }
  .logout-modal-box {
    background: #ffffff; border: 2px solid #e5e7eb;
    padding: 30px; border-radius: 16px; width: 90%; max-width: 360px;
    text-align: center;
    transform: translateY(20px) scale(0.95);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  #logoutOverlay.open .logout-modal-box { transform: none; }
  .logout-modal-title {
    font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px;
    color: #dc2626; margin-bottom: 8px;
  }
  .logout-modal-text { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
  .logout-modal-actions { display: flex; gap: 12px; }
  .logout-modal-btn {
    flex: 1; height: 42px; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
    cursor: pointer; border: none; transition: background 0.2s, transform 0.1s;
  }
  .logout-modal-btn:active { transform: scale(0.96); }
  .logout-btn-cancel { background: #e5e7eb; color: #111827; }
  .logout-btn-cancel:hover { background: #d1d5db; }
  .logout-btn-confirm { background: #1e3a8a; color: #ffffff; }
  .logout-btn-confirm:hover { background: #0056b3; }
</style>

<!-- LOGOUT MODAL -->
<div id="logoutOverlay">
  <div class="logout-modal-box">
    <div class="logout-modal-title">Confirm Logout</div>
    <div class="logout-modal-text">Are you sure you want to log out your account?</div>
    <div class="logout-modal-actions">
      <button class="logout-modal-btn logout-btn-cancel"  onclick="closeLogoutModal()">Cancel</button>
      <button class="logout-modal-btn logout-btn-confirm" onclick="confirmLogout()">Yes</button>
    </div>
  </div>
</div>

<script>
  function openLogoutModal(e) { e.preventDefault(); document.getElementById("logoutOverlay").classList.add("open"); }
  function closeLogoutModal()  { document.getElementById("logoutOverlay").classList.remove("open"); }
  function confirmLogout()     { window.location.href = "/logout"; }
  document.getElementById("logoutOverlay").addEventListener("click", function(e) { if (e.target === this) closeLogoutModal(); });
  async function refreshBadge() {
  try {
    const res = await fetch('/notifications/unread-count');
    const data = await res.json();
    const badge = document.getElementById('notif-badge');
    const bellBtn = document.querySelector('.notif-wrapper button');
    if (data.count > 0) {
      badge.textContent = data.count;
      badge.style.display = 'inline';
      // highlight the bell
      bellBtn.style.background = '#1e3a8a';
      bellBtn.style.borderColor = '#1e3a8a';
      bellBtn.querySelector('svg').setAttribute('stroke', 'white');
    } else {
      badge.style.display = 'none';
      // reset bell
      bellBtn.style.background = 'white';
      bellBtn.style.borderColor = '#e5e7eb';
      bellBtn.querySelector('svg').setAttribute('stroke', '#1e3a8a');
    }
  } catch(e) {}
}

async function toggleNotifDropdown(e) {
  e.preventDefault();
  const dropdown = document.getElementById('notif-dropdown');
  const isHidden = dropdown.style.display === 'none';
  dropdown.style.display = isHidden ? 'block' : 'none';
  if (isHidden) await loadNotifications();
}

async function loadNotifications() {
  const res = await fetch('/notifications');
  const data = await res.json();
  const list = document.getElementById('notif-list');

  if (!data.length) {
    list.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:20px;font-size:13px;">No notifications</p>';
    return;
  }

  const icons = { sale: '💰', inventory: '📦', reorder: '🔄' };

  list.innerHTML = data.map(n => `
    <div onclick="readAndGo(${n.id}, '${n.link || ''}')" style="
      padding:12px 16px; cursor:pointer;
      border-bottom:1px solid #f9fafb;
      background:${n.is_read ? '#fff' : '#eff6ff'};
    ">
      <div style="display:flex; gap:8px; align-items:flex-start;">
        <span style="font-size:16px;">${icons[n.type] || '🔔'}</span>
        <div style="flex:1;">
          <div style="font-size:13px; color:#111827;">${n.message}</div>
          <div style="font-size:11px; color:#9ca3af; margin-top:3px;">${n.date_label}</div>
        </div>
        ${!n.is_read ? '<span style="width:7px;height:7px;background:#1e3a8a;border-radius:50%;margin-top:4px;flex-shrink:0;display:inline-block;"></span>' : ''}
      </div>
    </div>
  `).join('');
}

async function readAndGo(id, link) {
  await fetch(`/notifications/mark-read/${id}`, { method: 'POST' });
  refreshBadge();
  if (link) window.location.href = link;
}

async function markAllRead() {
  await fetch('/notifications/mark-all-read', { method: 'POST' });
  refreshBadge();
  loadNotifications();
}

document.addEventListener('click', function(e) {
  const wrapper = document.querySelector('.notif-wrapper');
  if (wrapper && !wrapper.contains(e.target)) {
    document.getElementById('notif-dropdown').style.display = 'none';
  }
});

setInterval(refreshBadge, 30000);
window.addEventListener('DOMContentLoaded', refreshBadge);
</script>
