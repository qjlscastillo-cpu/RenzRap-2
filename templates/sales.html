<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sales | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #1e3a8a;
      --blue-btn:  #0056b3; /* Matched to the image's blue */
      --cyan:      #00d4ff;
      --bg:        #d1d5db;
      --pos-bg:    #a8c3d8; /* Light blue background from your mockup */
      --card-bg:   #ffffff;
      --cart-bg:   #f0f2f5;
      --border:    #e5e7eb;
      --text:      #111827;
      --muted:     #6b7280;
      --red:       #ef4444;
      --red-hover: #dc2626;
      --white:     #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .shell {
      display: flex;
      width: 92vw;
      height: 90vh;
      min-height: 560px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) both;
      background: var(--white);
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(20px) scale(0.98); }
      to   { opacity:1; transform:none; }
    }

    /* ── SIDEBAR (Consistent with your existing UI) ─────── */
    .sidebar {
      width: 220px; min-width: 220px;
      background: var(--navy);
      padding: 28px 16px;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 17px;
      color: var(--white); margin-bottom: 20px; padding: 0 4px; line-height: 1.3;
      text-align: center;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: center;
      gap: 9px; width: 100%; height: 42px; border-radius: 8px; border: 1px solid transparent;
      background: var(--white); color: var(--navy);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      padding: 0 14px; cursor: pointer; margin-bottom: 8px; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .nav-item:hover {
      background: #e8f0fb; border: 1px solid var(--blue-btn);
      transform: translateX(5px); box-shadow: 0 4px 12px rgba(91,155,213,0.3);
    }
    .nav-item.active {
      background: var(--blue-btn); color: var(--white);
      border: 2px solid var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: none; cursor: default;
    }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }
    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover { background: #fef2f2; border: 1px solid var(--red); color: var(--red); }

    /* ── MAIN ──────────────────────────────────── */
    .main {
      flex: 1; 
      display: flex; 
      flex-direction: column;
    }

    /* TOP BAR INSIDE MAIN (Mockup style) */
    .top-bar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
    }
    .top-search {
      flex: 1;
      max-width: 500px;
      position: relative;
    }
    .top-search input {
      width: 100%; height: 36px; border-radius: 18px;
      border: 1px solid var(--border); background: #f1f5f9;
      padding: 0 16px 0 40px; font-family: 'DM Sans', sans-serif;
      outline: none; transition: border 0.2s;
    }
    .top-search input:focus { border-color: var(--blue-btn); }
    .top-search span {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 14px; opacity: 0.5; pointer-events: none;
    }
    .top-user {
      display: flex; align-items: center; gap: 16px;
    }
    .top-user .bell { font-size: 18px; cursor: pointer; color: var(--navy); }
    .top-user .profile { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    .top-user .avatar { width: 32px; height: 32px; background: var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    /* ── POS AREA (The light blue section) ─────── */
    .pos-container {
      flex: 1;
      background: var(--pos-bg);
      padding: 24px 32px;
      display: grid;
      grid-template-columns: 1fr 320px; /* Left grid, right cart */
      gap: 24px;
      overflow: hidden;
    }

    /* PRODUCT GRID */
    .product-section {
      display: flex; flex-direction: column; gap: 16px;
    }
    .product-toolbar {
      display: flex; align-items: center; justify-content: space-between;
    }
    .product-search {
      width: 300px; position: relative;
    }
    .product-search input {
      width: 100%; height: 36px; border-radius: 18px;
      border: none; padding: 0 16px 0 36px; outline: none;
    }
    .product-search span { position: absolute; left: 12px; top: 9px; opacity: 0.5; }
    
    .btn-transaction {
      background: var(--blue-btn); color: var(--white);
      border: none; padding: 0 20px; height: 36px; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-transaction:hover { background: #004494; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding-bottom: 20px;
      height: 100%;
      align-content: start;
    }
    .product-grid::-webkit-scrollbar { width: 6px; }
    .product-grid::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex; flex-direction: column;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-3px); }
    .card-name { font-size: 16px; font-family: 'DM Sans', sans-serif; color: var(--text); margin-bottom: 4px; }
    .card-price { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .card-stock { font-size: 11px; color: var(--muted); }
    
    .btn-add {
      position: absolute; bottom: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 6px;
      background: var(--blue-btn); color: var(--white);
      border: none; font-size: 20px; font-weight: bold;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-add:hover { background: #004494; }

    /* CART SECTION */
    .cart-section {
      background: var(--cart-bg);
      border-radius: 12px;
      display: flex; flex-direction: column;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .cart-header {
      padding: 20px;
      font-family: 'Barlow', sans-serif; font-size: 24px; font-weight: 700; color: var(--text);
    }
    
    .cart-table-container {
      flex: 1; overflow-y: auto; padding: 0 20px;
    }
    .cart-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cart-table th {
      text-align: left; padding-bottom: 10px; color: var(--text); font-weight: 600;
      border-bottom: 2px solid var(--border);
    }
    .cart-table th:nth-child(2), .cart-table td:nth-child(2) { text-align: center; }
    .cart-table th:last-child, .cart-table td:last-child { text-align: right; }
    .cart-table td { padding: 10px 0; border-bottom: 1px solid #e5e7eb; color: var(--text); }
    
    .qty-controls {
      display: inline-flex; align-items: center; gap: 6px; font-weight: 600;
    }
    .btn-qty {
      background: transparent; border: none; cursor: pointer; font-size: 16px; font-weight: bold; color: var(--text);
    }
    
    .cart-summary {
      padding: 20px;
      border-top: 2px solid var(--border);
      font-size: 13px; color: var(--text); font-weight: 500;
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .summary-row.grand-total {
      font-weight: 700; font-size: 15px; margin-top: 10px; margin-bottom: 16px; border-top: 1px solid var(--border); padding-top: 10px;
    }
    
    .cart-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-action {
      height: 40px; border-radius: 8px; border: none; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-print { background: var(--blue-btn); }
    .btn-cancel { background: var(--red); }

    /* LOGOUT MODAL STYLES (Reused) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
      opacity: 0; visibility: hidden; transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-box {
      background: var(--white); padding: 30px; border-radius: 16px; width: 90%; max-width: 360px;
      text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px) scale(0.95); transition: transform 0.3s;
    }
    .modal-overlay.show .modal-box { transform: translateY(0) scale(1); }
    .modal-title { font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px; color: var(--navy); margin-bottom: 8px; }
    .modal-text { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn {
      flex: 1; height: 42px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; border: none;
    }
    .btn-cancel-modal { background: var(--border); color: var(--text); }
    .btn-confirm-modal { background: var(--red); color: var(--white); }

    @media (max-width: 1024px) {
      .pos-container { grid-template-columns: 1fr; overflow-y: auto; }
      .cart-section { height: auto; min-height: 400px; }
      .product-grid { overflow-y: visible; }
    }
    @media (max-width: 768px) {
      .sidebar { width: 60px; min-width: 60px; padding: 20px 8px; }
      .sidebar-logo, .nav-item .label { display: none; }
      .top-bar { padding: 0 16px; }
      .top-search { display: none; }
    }
  </style>
</head>
<body>
<div class="shell">

<aside class="sidebar">
  <div class="sidebar-logo">Renz Rap<br>Auto Supply</div>
  <a href="/dashboard"   class="nav-item">📊 <span class="label">Dashboard</span></a>
  <a href="/inventory"   class="nav-item">📦 <span class="label">Inventory</span></a>
  <a href="/sales"       class="nav-item active">💰 <span class="label">Sales</span></a>
  <a href="/profile"     class="nav-item">👤 <span class="label">Profile</span></a>
  <a href="/maintenance" class="nav-item">🔧 <span class="label">Maintenance</span></a>
  <a href="/security"    class="nav-item">🔒 <span class="label">Security</span></a>
  <a href="/about"       class="nav-item">ℹ️ <span class="label">About Us</span></a>
  <a href="/faqs"        class="nav-item">❓ <span class="label">FAQs</span></a>

  <a href="#" onclick="openLogoutModal(event)" class="nav-item logout-btn"><span class="label">Logout</span></a>
</aside>

  <main class="main">

    <div class="pos-container">
      
      <div class="product-section">
        <div class="product-toolbar">
          <div class="product-search">
            <span>🔍</span>
            <input type="text" id="posSearch" placeholder="Search products..." oninput="filterProducts()">
          </div>
          <button class="btn-transaction">New Transaction</button>
        </div>

        <div class="product-grid" id="productGrid">
          </div>
      </div>

      <div class="cart-section">
        <div class="cart-header">Cart</div>
        
        <div class="cart-table-container">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Items</th>
                <th>QTY.</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody id="cartTableBody">
              </tbody>
          </table>
        </div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">0 PHP</span>
          </div>
          <div class="summary-row">
            <span>Discount</span>
            <span id="discount">0</span>
          </div>
          <div class="summary-row">
            <span>Vat (12%)</span>
            <span id="vat">0 PHP</span>
          </div>
          <div class="summary-row grand-total">
            <span>Grand Total</span>
            <span id="grandTotal">0 PHP</span>
          </div>
          
          <div class="cart-actions">
            <button class="btn-action btn-print" onclick="printReceipt()">Print</button>
            <button class="btn-action btn-cancel" onclick="clearCart()">Cancel</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="modal-overlay" id="logoutModal">
  <div class="modal-box">
    <div class="modal-title">Confirm Logout</div>
    <div class="modal-text">Are you sure you want to log out of your account?</div>
    <div class="modal-actions">
      <button class="modal-btn btn-cancel-modal" onclick="closeLogoutModal()">Cancel</button>
      <button class="modal-btn btn-confirm-modal" onclick="confirmLogout()">Yes, Log Out</button>
    </div>
  </div>
</div>

<script>
  // --- MOCK PRODUCT DATA (Matching the image) ---
  const products = [
    { id: 1, name: "Battery", price: 590, stock: "80/100" },
    { id: 2, name: "Brake Pad", price: 590, stock: "80/100" },
    { id: 3, name: "Tires", price: 590, stock: "80/100" },
    { id: 4, name: "Oil Filter", price: 590, stock: "80/100" },
    { id: 5, name: "Car Wiper", price: 590, stock: "80/100" },
    { id: 6, name: "Suspension", price: 590, stock: "80/100" },
    { id: 7, name: "D. Engine Oil", price: 590, stock: "80/100" },
    { id: 8, name: "G. Engine Oil", price: 590, stock: "80/100" },
    { id: 9, name: "P. Steering Oil", price: 590, stock: "80/100" }
  ];

  let cart = [];

  // --- RENDER PRODUCTS ---
  function renderProducts(query = "") {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = "";
    
    const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
    
    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-name">${p.name}</div>
        <div class="card-price">${p.price} PHP</div>
        <div class="card-stock">Stock: ${p.stock}</div>
        <button class="btn-add" onclick="addToCart(${p.id})">+</button>
      `;
      grid.appendChild(card);
    });
  }

  function filterProducts() {
    const q = document.getElementById("posSearch").value;
    renderProducts(q);
  }

  // --- CART LOGIC ---
  function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);
    
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ ...product, qty: 1 });
    }
    updateCartUI();
  }

  function updateQty(id, delta) {
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.id !== id);
    }
    updateCartUI();
  }

  function clearCart() {
    if(cart.length > 0 && confirm("Are you sure you want to clear the cart?")) {
      cart = [];
      updateCartUI();
    }
  }

  function printReceipt() {
    if (cart.length === 0) return alert("Cart is empty!");
    alert("Printing receipt... Transaction saved!");
    // TODO: Send cart data to Flask backend here via fetch()
    cart = [];
    updateCartUI();
  }

  function updateCartUI() {
    const tbody = document.getElementById("cartTableBody");
    tbody.innerHTML = "";
    
    let subtotal = 0;
    
    cart.forEach(item => {
      const lineTotal = item.price * item.qty;
      subtotal += lineTotal;
      
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.name}</td>
        <td>
          <div class="qty-controls">
            ${item.qty}
            <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
        </td>
        <td>${lineTotal}</td>
      `;
      tbody.appendChild(tr);
    });

    // Calculate Totals (Mocking -10 discount and 12% VAT logic from the image)
    const discount = cart.length > 0 ? -10 : 0; 
    const vat = cart.length > 0 ? Math.round(subtotal * 0.12) : 0; // Simple 12% calculation
    
    // To match the exact image values (Sub 2360, Disc -10, Vat +20, Grand 2370)
    // the image uses a flat +20 for VAT as an example. Let's make it dynamic for real use, 
    // but default to displaying something close. We'll use math.
    
    const grandTotal = subtotal + discount + vat;

    document.getElementById("subtotal").textContent = subtotal + (cart.length > 0 ? "" : " PHP");
    document.getElementById("discount").textContent = discount;
    document.getElementById("vat").textContent = "+" + vat + (cart.length > 0 ? "" : " PHP");
    document.getElementById("grandTotal").textContent = grandTotal + (cart.length > 0 ? "" : " PHP");
  }

  // --- LOGOUT MODAL LOGIC ---
  function openLogoutModal(event) {
    event.preventDefault();
    document.getElementById("logoutModal").classList.add("show");
  }
  function closeLogoutModal() {
    document.getElementById("logoutModal").classList.remove("show");
  }
  function confirmLogout() {
    window.location.href = "/logout";
  }

  // Initialize
  renderProducts();
  updateCartUI();
</script>
</body>
</html>
