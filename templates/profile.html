<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:      #1e3a8a;
      --blue-btn:  #0056b3;
      --cyan:      #00d4ff;
      --bg:        #ffffff;
      --card-bg:   #f8fafc;
      --border:    #e5e7eb;
      --text:      #111827;
      --muted:     #6b7280;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --red-bd:    #fecaca;
      --white:     #ffffff;
    }

    [data-theme="dark"] {
      --navy:       #0f172a;
      --navy-light: #1e293b;
      --navy-dark:  #09183d;
      --navy-mid:   #0f172a;
      --blue-btn:   #1e40af;
      --cyan:       #22d3ee;
      --cyan-dim:   #0891b2;
      --bg:         #0f172a;
      --pos-bg:     #0f172a;
      --cart-bg:    #1e293b;
      --card-bg:    #1e293b;
      --border:     #334155;
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --input-bg:   #1e293b;
      --white:      #1e293b;
      --green:      #22c55e;
      --green-bg:   #052e16;
      --green-bd:   #166534;
      --red:        #ef4444;
      --red-bg:     #450a0a;
      --red-bd:     #7f1d1d;
      --red-hover:  #7f1d1d;
      --yellow:     #eab308;
      --yellow-bg:  #422006;
      --yellow-bd:  #713f12;
      --success:    #10b981;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0px;
    }

    .shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      min-height: 560px;
      border-radius: 0px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .sidebar {
      width: 220px; min-width: 220px;
      background: var(--navy);
      padding: 28px 16px;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 17px;
      color: var(--white); margin-bottom: 20px; padding: 0 4px; line-height: 1.3;
      text-align: center;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 9px;
      width: 100%; height: 42px; border-radius: 8px; border: 1px solid transparent;
      background: var(--white); color: var(--navy);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      padding: 0 14px; cursor: pointer; margin-bottom: 8px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .nav-item:hover {
      background: #e8f0fb;
      border: 1px solid var(--blue-btn);
      transform: translateY(0.5px);
      box-shadow: 0 4px 12px rgba(91,155,213,0.3);
    }
    .nav-item.active {
      background: var(--blue-btn); color: var(--white);
      border: 2px solid var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: none; cursor: default;
    }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }

    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover {
      background: var(--red-bg);
      border: 1px solid var(--red);
      color: var(--red);
      box-shadow: 0 4px 12px rgba(220,38,38,0.3);
    }

    .main {
      flex: 1; background: var(--white);
      padding: 28px 32px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 16px;
    }

    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; position: relative; min-width: 160px;
    }
    .search-box input {
      width: 100%; height: 38px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card-bg);
      padding: 0 14px 0 36px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus { border-color: var(--blue-btn); box-shadow: 0 0 0 3px rgba(91,155,213,0.15); }
    .search-box input::placeholder { color: #b0b8c9; }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 14px; opacity: 0.4; pointer-events: none;
    }

    .btn-add {
      display: flex; align-items: center; gap: 7px;
      height: 38px; padding: 0 18px; border-radius: 8px; border: none;
      background: #1e3a8a; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
      white-space: nowrap;
    }
    .btn-add:hover { background: #0056b3; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,130,246,0.35); }

    .table-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .table-header {
      padding: 14px 18px 10px;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      border-bottom: 1px solid var(--border);
      background: var(--navy);
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .table-scroll { overflow-y: auto; flex: 1; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }

    thead th {
      background: #f1f5f9;
      padding: 12px 14px;
      text-align: left;
      font-weight: 900;
      -webkit-text-stroke: 0.5px var(--navy);
      color: var(--navy);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: sticky;
      top: 0;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--blue-btn); }
    thead th.sorted { color: var(--blue-btn); }
    .sort-arrow { margin-left: 4px; opacity: 0.5; font-size: 10px; }
    thead th.sorted .sort-arrow { opacity: 1; }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 11px 14px; color: var(--text); text-align: left; vertical-align: middle; }
    tbody tr:hover { background: #eff6ff; }
    .empty-row td { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

    .user-name { font-weight: 600; color: var(--navy); }

    .role-badge {
      display: inline-block; padding: 2px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; white-space: nowrap;
      background: #e2e8f0; color: var(--navy); border: 1px solid #cbd5e1;
    }

    /* ── Action buttons — navy edit, red delete ── */
    .btn-action {
      display: inline-flex; align-items: center; gap: 4px;
      height: 30px; padding: 0 10px; border-radius: 6px; border: none;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-right: 4px;
    }
    .btn-action.edit {
      background: #1e3a8a; color: var(--white);
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }
    .btn-action.edit:hover {
      background: #0056b3;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(59,130,246,0.35);
    }

    .btn-action.disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; opacity: 0.5; pointer-events: none; box-shadow: none; }

    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap; }
    .badge-active { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
    .badge-inactive { background:#f3f4f6; color:#6b7280; border:1px solid #d1d5db; }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); backdrop-filter: blur(3px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--white); border-radius: 16px;
      width: 100%; max-width: 560px; padding: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      animation: modal-in 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes modal-in {
      from { opacity:0; transform:scale(0.9) translateY(16px); }
      to   { opacity:1; transform:none; }
    }
    .modal-title {
      font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 18px;
      color: var(--navy); margin-bottom: 20px;
    }
    .field { margin-bottom: 14px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%; height: 40px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--card-bg);
      padding: 0 12px; font-family: 'DM Sans', sans-serif;
      font-size: 13px; color: var(--text); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus, .field select:focus {
      border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
    }
    .modal-footer {
      display: flex; gap: 10px; margin-top: 22px; justify-content: flex-end;
    }
    .btn-cancel {
      height: 40px; padding: 0 20px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--white);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      color: var(--muted); cursor: pointer; transition: background 0.15s;
    }
    .btn-cancel:hover { background: var(--card-bg); }
    .btn-save {
      height: 40px; padding: 0 24px; border-radius: 8px; border: none;
      background: #1e3a8a; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }
    .btn-save:hover { background: #0056b3; transform: translateY(-1px); }

    .delete-modal {
      background: var(--white); border-radius: 16px;
      width: 100%; max-width: 400px; padding: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      animation: modal-in 0.25s cubic-bezier(0.34,1.56,0.64,1) both;
      text-align: center;
    }
    .delete-icon {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--red-bg); border: 2px solid var(--red-bd);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .delete-modal h3 {
      font-family: 'Barlow', sans-serif; font-weight: 800;
      font-size: 18px; color: var(--text); margin-bottom: 10px;
    }
    .delete-modal p {
      font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 24px;
    }
    .delete-modal p strong { color: var(--text); font-weight: 600; }
    .delete-footer { display: flex; gap: 10px; justify-content: center; }
    .delete-footer .btn-cancel,
    .delete-footer .btn-confirm-delete { flex: 1; }
    .btn-confirm-delete {
      height: 40px; padding: 0 24px; border-radius: 8px; border: none;
      background: #1e3a8a; color: var(--white);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 12px rgba(59,130,246,0.25);
    }
    .btn-confirm-delete:hover { background: #0056b3; transform: translateY(-1px); }

    #logoutOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    #logoutOverlay.open { opacity: 1; visibility: visible; }
    .logout-modal-box {
      background: var(--white); border: 2px solid var(--border);
      padding: 30px; border-radius: 16px; width: 90%; max-width: 360px;
      text-align: center;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    #logoutOverlay.open .logout-modal-box { transform: none; }
    .logout-modal-title {
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px;
      color: var(--red); margin-bottom: 8px;
    }
    .logout-modal-text { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .logout-modal-actions { display: flex; gap: 12px; }
    .logout-modal-btn {
      flex: 1; height: 42px; border-radius: 8px;
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; border: none; transition: background 0.2s, transform 0.1s;
    }
    .logout-modal-btn:active { transform: scale(0.96); }
    .logout-btn-cancel  { background: var(--border); color: var(--text); }
    .logout-btn-cancel:hover  { background: #d1d5db; }
    .logout-btn-confirm { background: var(--navy); color: var(--white); }
    .logout-btn-confirm:hover { background: var(--blue-btn); }

    @media (max-width: 768px) {
      .sidebar { width: 60px; min-width: 60px; padding: 20px 8px; }
      .sidebar-logo, .nav-item .label { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .main { padding: 16px; }
    }
    .page-title { font-family: 'Barlow', sans-serif; font-size: 24px; font-weight: 800; padding: 14px 20px; background: linear-gradient(135deg, #1e3a8a 0%, #1e3a8a 100%); color: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(30,58,138,0.2); }
    [data-theme="dark"] #usersTable tbody tr:hover { background: rgba(59,130,246,0.08) !important; }
  </style>
</head>
<body>

<div class="shell">
  {% include "sidebar.html" %}
  <main class="main">

    
    <div class="table-card">

      <div class="table-header">Manage Users</div>

      <div style="padding: 12px 14px 8px; border-bottom: 1px solid var(--border); background: var(--card-bg); flex-shrink: 0;">
        <div class="toolbar">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by name, username, email, phone, or role…" oninput="renderTable()"/>
          </div>
          <button class="btn-add" onclick="openUserModal()">＋ Add User</button>
        </div>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th data-key="name" onclick="sortBy('name')" style="text-align:left">Name <span class="sort-arrow">⇅</span></th>
              <th data-key="username" onclick="sortBy('username')" style="text-align:center">Username <span class="sort-arrow">⇅</span></th>
              <th data-key="email" onclick="sortBy('email')" style="text-align:center">Email <span class="sort-arrow">⇅</span></th>
              <th data-key="phone" onclick="sortBy('phone')" style="text-align:center">Phone <span class="sort-arrow">⇅</span></th>
              <th data-key="role" onclick="sortBy('role')" style="text-align:center">Role <span class="sort-arrow">⇅</span></th>
              <th style="text-align:center">Status</th>
              <th style="text-align:center">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr class="empty-row">
              <td colspan="7">No users found. Click <strong>＋ Add User</strong> to create one.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>

<!-- ADD / EDIT USER MODAL -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Add New User</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
    <div class="field" style="margin:0;">
      <label>Full Name</label>
      <input type="text" id="fName" placeholder="Enter full name"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Username</label>
      <input type="text" id="fUsername" placeholder="Enter username"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Password</label>
      <input type="password" id="fPassword" placeholder="Enter password" maxlength="8"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Role</label>
      <select id="fRole">
        <option value="" disabled selected>Select a role</option>
        <option value="Employee">Employee</option>
        <option value="Admin">Admin</option>
    </select>
    </div>
    <div class="field" style="margin:0;">
      <label>Email</label>
      <input type="email" id="fEmail" placeholder="Enter email"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Phone</label>
      <input type="tel" id="fPhone" placeholder="Enter phone number" oninput="this.value=this.value.replace(/\D/g,'')"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Address</label>
      <input type="text" id="fAddress" placeholder="Enter address"/>
    </div>
    <div class="field" style="margin:0;">
      <label>Date Hired</label>
      <input type="date" id="fDateHired"/>
    </div>
    </div>
    <div class="field" id="inactiveField" style="display:none;margin-top:12px;">
    <label style="display:flex;align-items:center;gap:10px;cursor:pointer;text-transform:none;font-size:13px;font-weight:600;color:var(--text);letter-spacing:0;">
      <input type="checkbox" id="fInactive" style="width:16px;height:16px;accent-color:var(--navy);cursor:pointer;flex-shrink:0;"/>
      Mark as Inactive
      <span style="font-size:11px;color:var(--muted);font-weight:400;">(User will be disabled)</span>
    </label>
  </div>
  <div class="modal-footer">
      <button class="btn-cancel" onclick="closeUserModal()">Cancel</button>
      <button class="btn-save" id="modalSaveBtn" onclick="saveUser()">Add User</button>
    </div>
  </div>
</div>

<script>
  let users      = [];
  let editingId  = null;
  let sortKey    = null;
  let sortAsc    = true;

  const editIcon   = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;

  function sortBy(key) {
    sortAsc = (sortKey === key) ? !sortAsc : true;
    sortKey = key;
    renderTable();
  }

  async function loadUsers() {
    const res = await fetch("/api/users");
    users = await res.json();
    renderTable();
  }

  function renderTable() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const tbody  = document.getElementById("userTableBody");

    let filtered = users.filter(u =>
      !u.inactive &&
      (u.name.toLowerCase().includes(search)     ||
       u.username.toLowerCase().includes(search) ||
       u.role.toLowerCase().includes(search)     ||
       (u.email || '').toLowerCase().includes(search) ||
       (u.phone || '').toLowerCase().includes(search) ||
       (u.address || '').toLowerCase().includes(search))
    );

    if (sortKey) {
      filtered.sort((a, b) => {
        const valA = (a[sortKey] ?? "").toString().toLowerCase();
        const valB = (b[sortKey] ?? "").toString().toLowerCase();
        if (valA < valB) return sortAsc ? -1 :  1;
        if (valA > valB) return sortAsc ?  1 : -1;
        return 0;
      });
    } else {
      filtered.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    }

    document.querySelectorAll("thead th[data-key]").forEach(th => {
      const key   = th.dataset.key;
      const arrow = th.querySelector(".sort-arrow");
      th.classList.toggle("sorted", key === sortKey);
      if (arrow) arrow.textContent = key === sortKey ? (sortAsc ? "▲" : "▼") : "⇅";
    });

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="7">${
        users.length === 0
          ? 'No users found. Click <strong>＋ Add User</strong> to create one.'
          : 'No results found.'
      }</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(u => `
      <tr${u.inactive ? ' style="opacity:0.5"' : ''}>
        <td style="text-align:left"><span class="user-name">${u.name}</span></td>
        <td style="text-align:center">${u.username}</td>
        <td style="text-align:center;font-size:12px;">${u.email || '—'}</td>
        <td style="text-align:center;font-size:12px;">${u.phone || '—'}</td>
        <td style="text-align:center"><span class="role-badge">${u.role}</span></td>
        <td style="text-align:center"><span class="badge ${u.inactive ? 'badge-inactive' : 'badge-active'}">${u.inactive ? 'Inactive' : 'Active'}</span></td>
        <td style="text-align:center;white-space:nowrap;">
          <button class="btn-action edit"   onclick="editUser(${u.id})"   title="Edit">${editIcon} Edit</button>
        </td>
      </tr>
    `).join("");
  }

  async function saveUser() {
    const name      = document.getElementById("fName").value.trim();
    const username  = document.getElementById("fUsername").value.trim();
    const password  = document.getElementById("fPassword").value.trim();
    const role      = document.getElementById("fRole").value;
    const inactive  = document.getElementById("fInactive").checked;
    const email     = document.getElementById("fEmail").value.trim();
    const phone     = document.getElementById("fPhone").value.trim();
    const address   = document.getElementById("fAddress").value.trim();
    const date_hired = document.getElementById("fDateHired").value;

    if (!name || !username || !role) { alert("Please fill in Name, Username, and Role."); return; }
    if (!editingId && !password)     { alert("Password is required when adding a new user."); return; }
    if (password && password.length > 8) { alert("Password must be 8 characters or less."); return; }
    if (phone && !/^\d+$/.test(phone)) { alert("Phone number must contain only digits."); return; }

    const method = editingId ? "PUT" : "POST";
    const url    = editingId ? `/api/users/${editingId}` : "/api/users";

    const body = { name, username, password, role, inactive, email, phone, address, date_hired };

    const res  = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.success) { closeUserModal(); loadUsers(); }
    else              { alert(data.message || "Something went wrong."); }
  }

  function editUser(id) {
    const u = users.find(u => u.id === id);
    editingId = id;
    document.getElementById("fName").value      = u.name;
    document.getElementById("fUsername").value  = u.username;
    document.getElementById("fPassword").value  = "";
    document.getElementById("fRole").value      = u.role;
    document.getElementById("fEmail").value     = u.email || "";
    document.getElementById("fPhone").value     = u.phone || "";
    document.getElementById("fAddress").value   = u.address || "";
    document.getElementById("fDateHired").value = u.date_hired ? u.date_hired.substring(0,10) : "";
    document.getElementById("modalTitle").textContent   = "Edit User";
    document.getElementById("modalSaveBtn").textContent = "Save Changes";
    const fInactive = document.getElementById("fInactive");
    fInactive.checked = !!u.inactive;
    document.getElementById("inactiveField").style.display = "block";
    document.getElementById("userModal").classList.add("open");
  }

  function openUserModal() {
    editingId = null;
    document.getElementById("fName").value      = "";
    document.getElementById("fUsername").value  = "";
    document.getElementById("fPassword").value  = "";
    document.getElementById("fRole").value      = "";
    document.getElementById("fEmail").value     = "";
    document.getElementById("fPhone").value     = "";
    document.getElementById("fAddress").value   = "";
    document.getElementById("fDateHired").value = "";
    document.getElementById("fInactive").checked = false;
    document.getElementById("inactiveField").style.display = "none";
    document.getElementById("modalTitle").textContent   = "Add New User";
    document.getElementById("modalSaveBtn").textContent = "Add User";
    document.getElementById("userModal").classList.add("open");
  }

  function closeUserModal() {
    document.getElementById("userModal").classList.remove("open");
    editingId = null;
  }

  document.getElementById("userModal").addEventListener("click", function(e) { if (e.target === this) closeUserModal(); });

  loadUsers();
</script>
</body>
</html>
