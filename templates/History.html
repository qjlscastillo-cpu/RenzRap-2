<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:       #1e3a8a;
      --navy-light: #2d52b0;
      --blue-btn:   #0056b3;
      --cyan:       #00d4ff;
      --bg:         #d1d5db;
      --card-bg:    #f8fafc;
      --border:     #e5e7eb;
      --text:       #111827;
      --muted:      #6b7280;
      --green:      #16a34a;
      --white:      #ffffff;
      --red:        #dc2626;
      --red-hover:  #fee2e2;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0px;
    }
    .shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      min-height: 560px;
      border-radius: 0px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--navy);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--white);
      margin-bottom: 20px;
      padding: 0 4px;
      line-height: 1.3;
      text-align: center;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      width: 100%;
      height: 42px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--white);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 0 14px;
      cursor: pointer;
      margin-bottom: 8px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .nav-item:hover {
      background: #e8f0fb;
      border: 1px solid var(--blue-btn);
      transform: translateY(0.5px);
      box-shadow: 0 4px 12px rgba(91,155,213,0.3);
    }
    .nav-item.active {
      background: var(--blue-btn);
      color: var(--white);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: none;
      cursor: default;
    }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }
    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover {
      background: var(--red-hover);
      border: 1px solid var(--red);
      color: var(--red);
      box-shadow: 0 4px 12px rgba(220,38,38,0.3);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      background: var(--white);
      padding: 28px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── History table card ── */
    .table-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .table-header-bar {
      padding: 14px 18px 10px;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      background: var(--navy);
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    /* ── Toolbar ── */
    .toolbar-row {
      padding: 12px 14px 8px;
      border-bottom: 1px solid var(--border);
      background: var(--card-bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-box {
      flex: 1;
      position: relative;
      min-width: 160px;
    }
    .search-box input {
      width: 100%; height: 38px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--white);
      padding: 0 14px 0 36px;
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus { border-color: var(--blue-btn); box-shadow: 0 0 0 3px rgba(91,155,213,0.15); }
    .search-box input::placeholder { color: #b0b8c9; }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      font-size: 14px; opacity: 0.4; pointer-events: none;
    }
    .filter-date {
      height: 38px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--white);
      font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text);
      outline: none; cursor: pointer;
    }
    .filter-date:focus { border-color: var(--blue-btn); }
    .table-scroll { overflow-y: auto; flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: #f1f5f9;
      padding: 11px 14px;
      text-align: left;
      font-weight: 900;
      -webkit-text-stroke: 0.5px var(--navy);
      color: var(--navy);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #e8f0fb; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 11px 14px; color: var(--text); vertical-align: middle; }
    tbody tr:hover { background: #eff6ff; }
    .empty-row td { text-align: center; color: var(--muted); padding: 40px; font-size: 13px; }

    /* ── View button in table ── */
    .view-btn {
      height: 26px;
      padding: 0 12px;
      border-radius: 6px;
      border: none;
      background: var(--navy);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.15s;
    }
    .view-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(0, 86, 179, 0.35);
      background: var(--blue-btn);
    }
    .view-btn:active {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 86, 179, 0.3);
    }

    /* ── Modal Close button ── */
    .modal-close-btn {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: var(--navy);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.15s;
    }
    .modal-close-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 86, 179, 0.35);
      background: var(--blue-btn);
    }
    .modal-close-btn:active {
      transform: translateY(-1px);
      box-shadow: 0 3px 8px rgba(0, 86, 179, 0.3);
    }

    /* badges */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-sale    { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
    .badge-restock { background:#eff6ff; color:#2563eb; border:1px solid #bfdbfe; }
    .badge-return  { background:#fffbeb; color:#eab308; border:1px solid #fde68a; }
    .badge-void    { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 10px 14px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
    }
    .page-btn {
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover:not(:disabled) { background: #e8f0fb; border-color: var(--blue-btn); }
    .page-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .modal-box {
      background: var(--white);
      border: 2px solid var(--border);
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-overlay.show .modal-box { transform: none; }
    .modal-title { font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px; color: var(--red); margin-bottom: 8px; }
    .modal-text  { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { flex: 1; height: 42px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: background 0.2s, transform 0.1s; }
    .modal-btn:active { transform: scale(0.96); }
    .btn-cancel  { background: var(--border); color: var(--text); }
    .btn-cancel:hover  { background: #d1d5db; }
    .btn-confirm { background: var(--navy); color: var(--white); }
    .btn-confirm:hover { background: #0056b3; }

    @media (max-width: 768px) {
      .sidebar { width: 60px; min-width: 60px; padding: 20px 8px; }
      .sidebar-logo { display: none; }
      .nav-item .label { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .main { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  
<div class="shell">
  {% include "sidebar.html" %}
  <main class="main">

    <div class="table-card">
      <div class="table-header-bar">History</div>

      <!-- Toolbar: search + date filter — record count removed, search fills space -->
      <div class="toolbar-row">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="filterSearch" placeholder="Search by ID or item…" oninput="applyFilters()"/>
        </div>
        <input type="date" id="filterDate" class="filter-date" onchange="applyFilters()"/>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('ref')"        data-key="ref">ID <span class="sort-arrow">⇅</span></th>
              <th onclick="sortBy('amount')"     data-key="amount">Total Price <span class="sort-arrow">⇅</span></th>
              <th onclick="sortBy('created_at')" data-key="created_at">Date <span class="sort-arrow">⇅</span></th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr class="empty-row"><td colspan="4">Loading history…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>

  </main>
</div>

<!-- View Transaction Modal — X button removed -->
<div class="modal-overlay" id="viewModal">
  <div class="modal-box" style="max-width:420px;text-align:left;padding:0;overflow:hidden;">

    <!-- Modal header (no X button) -->
    <div style="background:var(--navy);padding:16px 20px;">
      <div style="font-family:'Barlow',sans-serif;font-weight:700;font-size:18px;color:#fff;">Order Receipt</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:2px;" id="viewRef"></div>
    </div>

    <!-- Date -->
    <div style="padding:10px 20px;background:#f1f5f9;border-bottom:1px solid #e5e7eb;font-size:12px;color:var(--muted);" id="viewDate"></div>

    <!-- Items table -->
    <div style="padding:0 20px;max-height:260px;overflow-y:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr>
            <th style="text-align:left;padding:12px 0 8px;color:#111827;font-weight:600;border-bottom:2px solid #e5e7eb;">Items</th>
            <th style="text-align:center;padding:12px 0 8px;color:#111827;font-weight:600;border-bottom:2px solid #e5e7eb;">QTY.</th>
            <th style="text-align:right;padding:12px 0 8px;color:#111827;font-weight:600;border-bottom:2px solid #e5e7eb;">Price</th>
          </tr>
        </thead>
        <tbody id="viewItems"></tbody>
      </table>
    </div>

    <!-- Summary -->
    <div style="padding:14px 20px;border-top:2px solid #e5e7eb;font-size:13px;font-weight:500;color:#111827;">
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
        <span>Subtotal</span><span id="viewSubtotal"></span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
        <span>VAT (12%)</span><span id="viewVat"></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;border-top:1px solid #e5e7eb;padding-top:10px;margin-top:6px;">
        <span>Grand Total</span><span style="color:var(--green);" id="viewTotal"></span>
      </div>
    </div>

    <!-- Close button -->
    <div style="padding:0 20px 16px;">
      <button class="modal-close-btn" onclick="closeViewModal()">Close</button>
    </div>

  </div>
</div>

<script>
  let allData     = [];
  let filtered    = [];
  let sortKey     = 'created_at';
  let sortAsc     = false;
  const PAGE_SIZE = 15;
  let currentPage = 1;

  async function loadHistory() {
    try {
      const res = await fetch('/api/history');
      if (!res.ok) throw new Error(res.status);
      allData = await res.json();
    } catch {
      allData = generateDemoData();
    }
    applyFilters();
  }

  function generateDemoData() {
    const types  = ['Sale','Sale','Sale','Restock','Return','Void'];
    const items  = ['Brake Pad Set','Engine Oil 10W40','Air Filter','Spark Plug NGK','Radiator Hose','Timing Belt','Wiper Blade','Battery 65Ah','Alternator Belt','Clutch Disc'];
    const users  = ['Admin','Renz','Staff1'];
    const rows   = [];
    const base   = new Date();
    for (let i = 0; i < 48; i++) {
      const type = types[Math.floor(Math.random() * types.length)];
      const d    = new Date(base);
      d.setDate(d.getDate() - Math.floor(Math.random() * 60));
      rows.push({
        ref:          'TXN-' + String(1000 + i).padStart(4,'0'),
        item_name:    items[Math.floor(Math.random() * items.length)],
        type,
        quantity:     Math.floor(Math.random() * 20) + 1,
        amount:       type === 'Sale' ? (Math.random() * 4800 + 200).toFixed(2) : 0,
        created_at:   d.toISOString(),
        performed_by: users[Math.floor(Math.random() * users.length)],
      });
    }
    return rows.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  }

  function applyFilters() {
    const date   = document.getElementById('filterDate').value;
    const search = document.getElementById('filterSearch').value.toLowerCase().trim();

    filtered = allData.filter(row => {
      if (date) {
        const rowDate = new Date(row.created_at).toISOString().slice(0, 10);
        if (rowDate !== date) return false;
      }
      if (search && !row.item_name?.toLowerCase().includes(search) && !row.ref?.toLowerCase().includes(search)) return false;
      return true;
    });

    currentPage = 1;
    renderTable();
  }

  function sortBy(key) {
    sortAsc = sortKey === key ? !sortAsc : false;
    sortKey = key;
    currentPage = 1;
    renderTable();
  }

  function getSorted() {
    return [...filtered].sort((a, b) => {
      let vA = a[sortKey], vB = b[sortKey];
      if (sortKey === 'created_at') { vA = new Date(vA); vB = new Date(vB); }
      else if (sortKey === 'amount') { vA = Number(vA); vB = Number(vB); }
      else { vA = String(vA||'').toLowerCase(); vB = String(vB||'').toLowerCase(); }
      if (vA < vB) return sortAsc ? -1 : 1;
      if (vA > vB) return sortAsc ?  1 : -1;
      return 0;
    });
  }

  function renderTable() {
    document.querySelectorAll('thead th[data-key]').forEach(th => {
      const key   = th.dataset.key;
      const arrow = th.querySelector('.sort-arrow');
      if (arrow) {
        arrow.textContent = key === sortKey ? (sortAsc ? ' ▲' : ' ▼') : ' ⇅';
        th.style.color    = key === sortKey ? 'var(--blue-btn)' : 'var(--navy)';
      }
    });

    const sorted     = getSorted();
    const totalPages = Math.ceil(sorted.length / PAGE_SIZE) || 1;
    const start      = (currentPage - 1) * PAGE_SIZE;
    const page       = sorted.slice(start, start + PAGE_SIZE);

    const tbody = document.getElementById('historyBody');
    if (!page.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="4">No records found.</td></tr>`;
    } else {
      tbody.innerHTML = page.map(row => {
        const dateStr = new Date(row.created_at).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric' });
        return `<tr>
  <td style="font-size:11px;color:var(--muted);font-weight:600;">${row.ref || '—'}</td>
  <td style="font-weight:600;color:var(--green);">${Number(row.amount) > 0 ? '₱' + Number(row.amount).toLocaleString('en-PH', {minimumFractionDigits:2}) : '—'}</td>
  <td style="color:var(--muted);font-size:12px;">${dateStr}</td>
  <td><button class="view-btn" onclick="viewTransaction('${row.ref}')">View</button></td>
</tr>`;
      }).join('');
    }

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    const pg = document.getElementById('pagination');
    if (totalPages <= 1) { pg.innerHTML = ''; return; }

    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 2) {
        html += `<span style="color:var(--muted);font-size:13px;padding:0 2px;">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button>`;
    pg.innerHTML = html;
  }

  function goPage(p) {
    const total = Math.ceil(filtered.length / PAGE_SIZE) || 1;
    currentPage = Math.max(1, Math.min(p, total));
    renderTable();
  }

  function viewTransaction(ref) {
    const row = allData.find(r => r.ref === ref);
    if (!row) return;

    const items = row.items || [];
    const fmt = n => '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
    const dateStr = new Date(row.created_at).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    const rows = items.map(i => `
      <tr>
        <td style="padding:10px 0;border-bottom:1px solid #e5e7eb;color:#111827;">${i.name}</td>
        <td style="padding:10px 0;border-bottom:1px solid #e5e7eb;text-align:center;font-weight:600;">${i.qty}</td>
        <td style="padding:10px 0;border-bottom:1px solid #e5e7eb;text-align:right;">${fmt(i.price * i.qty)}</td>
      </tr>`).join('');

    document.getElementById('viewRef').textContent      = ref;
    document.getElementById('viewDate').textContent     = dateStr;
    document.getElementById('viewItems').innerHTML      = rows;
    document.getElementById('viewSubtotal').textContent = fmt(row.subtotal);
    document.getElementById('viewVat').textContent      = '+' + fmt(row.vat);
    document.getElementById('viewTotal').textContent    = fmt(row.amount);
    document.getElementById('viewModal').classList.add('show');
  }
  function closeViewModal() { document.getElementById('viewModal').classList.remove('show'); }

  loadHistory();
</script>
</body>
</html>
