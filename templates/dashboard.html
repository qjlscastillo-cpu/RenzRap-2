<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:       #1e3a8a;
      --navy-light: #2d52b0;
      --blue-btn:   #0056b3;
      --cyan:       #00d4ff;
      --bg:         #d1d5db;
      --card-bg:    #f8fafc;
      --border:     #e5e7eb;
      --text:       #111827;
      --muted:      #6b7280;
      --green:      #16a34a;
      --white:      #ffffff;
      --red:        #dc2626;
      --red-hover:  #fee2e2;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0px;
    }
    .shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      min-height: 560px;
      border-radius: 0px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(20px) scale(0.98); }
      to   { opacity:1; transform:none; }
    }
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--navy);
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-logo {
      font-family: 'Barlow', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--white);
      margin-bottom: 20px;
      padding: 0 4px;
      line-height: 1.3;
      text-align: center;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      width: 100%;
      height: 42px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--white);
      color: var(--navy);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 0 14px;
      cursor: pointer;
      margin-bottom: 8px;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .nav-item:hover {
      background: #e8f0fb;
      border: 1px solid var(--blue-btn);
      transform: translateY(0.5px);
      box-shadow: 0 4px 12px rgba(91,155,213,0.3);
    }
    .nav-item.active {
      background: var(--blue-btn);
      color: var(--white);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: none;
      cursor: default;
    }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }
    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover {
      background: var(--red-hover);
      border: 1px solid var(--red);
      color: var(--red);
      box-shadow: 0 4px 12px rgba(220,38,38,0.3);
    }
    .main {
      flex: 1;
      background: var(--white);
      padding: 32px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .top-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 16px;
      align-items: stretch;
    }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 20px;
      min-height: 125px;
    }
    .card-label       { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card-value-green { font-size: 26px; font-weight: 800; color: var(--muted); margin-top: 6px; }
    .card-value-navy  { font-size: 26px; font-weight: 800; color: var(--navy);  margin-top: 6px; }
    .filter-box {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 125px;
      justify-content: center;
      min-width: 110px;
    }
    .filter-btn {
      height: 28px;
      border-radius: 6px;
      border: 2px solid var(--border);
      background: var(--white);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .filter-btn:hover  { background: #e5e7eb; color: #374151; border-color: #9ca3af; }
    .filter-btn.active { background: var(--navy); color: var(--white); border-color: var(--navy); box-shadow: 0 4px 8px rgba(30,58,138,0.3); }
    .chart-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      padding: 20px 24px;
      flex: 1;
    }
    .chart-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .chart-card-title {
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--navy);
    }
    .chart-period-total {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--green);
      white-space: nowrap;
    }
    .chart-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-direction: column;
      gap: 8px;
      color: var(--muted);
    }
    .chart-placeholder .icon { font-size: 36px; opacity: 0.35; }
    .chart-placeholder p { font-size: 13px; }
    .chart-canvas-wrap { flex: 1; position: relative; min-height: 160px; }
    .table-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      overflow: hidden;
      max-height: 250px;
      display: flex;
      flex-direction: column;
    }
    .table-scroll { overflow-y: auto; flex: 1; }
    .table-header {
      padding: 14px 18px 10px;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      border-bottom: 1px solid var(--border);
      background: var(--navy);
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: #f1f5f9;
      padding: 12px 14px;
      font-weight: 900;
      -webkit-text-stroke: 0.5px var(--navy);
      color: var(--navy);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      position: sticky;
      top: 0;
      cursor: pointer;
      user-select: none;
    }
    /* Column-specific alignment for headers */
    thead th.col-stock  { text-align: left; }
    thead th.col-center { text-align: center; }

    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 11px 14px; color: var(--text); vertical-align: middle; }
    /* Column-specific alignment for cells */
    tbody td.col-stock  { text-align: left; }
    tbody td.col-center { text-align: center; }

    tbody tr:hover { background: #eff6ff; }
    .empty-row td { text-align: center; color: var(--muted); padding: 28px; font-size: 13px; }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-box {
      background: var(--white);
      border: 2px solid var(--border);
      box-shadow: none;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-title {
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px;
      color: var(--red);
      margin-bottom: 8px;
    }
    .modal-text {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .modal-actions { display: flex; gap: 12px; }
    .modal-btn { flex: 1; height: 42px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: background 0.2s, transform 0.1s; }
    .modal-btn:active { transform: scale(0.96); }
    .btn-cancel  { background: var(--border); color: var(--text); }
    .btn-cancel:hover  { background: #d1d5db; }
    .btn-confirm { background: var(--navy); color: var(--white); }
    .btn-confirm:hover { background: #0056b3; }
    @media (max-width: 768px) {
      .sidebar { width: 60px; min-width: 60px; padding: 20px 8px; }
      .sidebar-logo { display: none; }
      .nav-item .label { display: none; }
      .nav-item { justify-content: center; padding: 0; }
      .main { padding: 20px 16px; }
      .top-row { grid-template-columns: 1fr 1fr; }
      .filter-box { grid-column: 1 / -1; flex-direction: row; min-height: auto; }
    }
  </style>
</head>
<body>

<div class="shell">
  {% include "sidebar.html" %}
  <main class="main">

    <div style="margin-bottom:24px;">
      <div style="font-family:'Barlow',sans-serif;font-size:22px;font-weight:700;color:var(--navy);">
        Welcome to Renz Rap, {{ session.get('name', 'User') }}
      </div>
      <div style="font-size:14px;color:var(--muted);margin-top:2px;">
        Here's your business overview for today.
      </div>
    </div>

    <div class="top-row">
      <div class="card">
        <div class="card-label" id="salesTitle">Sales Today</div>
        <div class="card-value-green" id="salesValue">₱0</div>
      </div>
      <div class="card">
        <div class="card-label">Date Today</div>
        <div class="card-value-navy" id="monthValue">October</div>
        <div style="font-size:13px; color:var(--muted); margin-top:4px;" id="dayValue"></div>
      </div>
      <div class="filter-box">
        <button class="filter-btn active" onclick="setFilter('Daily',   this)">Daily</button>
        <button class="filter-btn"        onclick="setFilter('Monthly', this)">Monthly</button>
        <button class="filter-btn"        onclick="setFilter('Yearly',  this)">Yearly</button>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-card-header">
        <div class="chart-card-title" id="chartTitle">Sales Last 7 Days</div>
        <div class="chart-period-total" id="chartPeriodTotal"></div>
      </div>
      <div class="chart-placeholder" id="chartPlaceholder">
        <div class="icon">📈</div>
        <p>Your charts or graphs will appear here.</p>
      </div>
      <div class="chart-canvas-wrap" id="chartWrap" style="display:none;">
        <canvas id="salesChart"></canvas>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">Stock Transactions</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="col-stock"  data-key="item_name"  onclick="sortBy('item_name')" >Stocks   <span class="sort-arrow">⇅</span></th>
              <th class="col-center" data-key="created_at" onclick="sortBy('created_at')">Date     <span class="sort-arrow">⇅</span></th>
              <th class="col-center" data-key="quantity"   onclick="sortBy('quantity')"  >Quantity <span class="sort-arrow">⇅</span></th>
              <th class="col-center" data-key="status"     onclick="sortBy('status')"    >Status   <span class="sort-arrow">⇅</span></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr class="empty-row"><td colspan="4">No transactions yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  Chart.register(ChartDataLabels);

  const now = new Date();
  const dayNames   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const monthNames = ["January","February","March","April","May","June",
                      "July","August","September","October","November","December"];
  document.getElementById("monthValue").textContent =
    `${now.getDate()} ${monthNames[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById("dayValue").textContent = dayNames[now.getDay()];

  let salesData = { today: 0, month: 0, year: 0 };

  function formatPHP(amount) {
    return "+₱" + Number(amount).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  function formatPeriodTotal(amount) {
    return "+₱" + Number(amount).toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }
  function formatBarLabel(value) {
    if (!value || value === 0) return '';
    return '+₱' + Number(value).toLocaleString('en-PH', { maximumFractionDigits: 0 });
  }

  const CHART_ANIM_MS = 1000;
  function countUp(elementId, targetValue, formatFn, duration) {
    duration = duration || CHART_ANIM_MS;
    const el = document.getElementById(elementId);
    if (!el) return;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased    = 1 - Math.pow(1 - progress, 3);
      el.textContent = formatFn(targetValue * eased);
      if (progress < 1) requestAnimationFrame(tick);
      else              el.textContent = formatFn(targetValue);
    }
    requestAnimationFrame(tick);
  }

  const RED        = '#dc2626';
  const YELLOW     = '#eab308';
  const GREEN      = '#16a34a';
  const LIGHT_BLUE = '#38bdf8';

  const COLOR_THRESHOLDS = {
    daily:   { mid:  10_000,    high:  20_000,    top:  30_000     },
    monthly: { mid:  300_000,   high:  600_000,   top:  900_000  },
    yearly:  { mid:  3_600_000, high: 7_200_000, top: 10_800_000  },
  };

  let activePeriod = 'daily';

  function lerpColor(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    const ah = a.replace('#',''), bh = b.replace('#','');
    const ar = parseInt(ah.slice(0,2),16), ag = parseInt(ah.slice(2,4),16), ab2 = parseInt(ah.slice(4,6),16);
    const br = parseInt(bh.slice(0,2),16), bg = parseInt(bh.slice(2,4),16), bb2 = parseInt(bh.slice(4,6),16);
    return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab2+(bb2-ab2)*t)})`;
  }

  function animColor(value) {
    const t = COLOR_THRESHOLDS[activePeriod];
    if (value <= 0)      return RED;
    if (value >= t.top)  return lerpColor(GREEN, LIGHT_BLUE, Math.min((value - t.top) / (t.top * 0.5), 1));
    if (value >= t.high) return lerpColor(YELLOW,  GREEN, (value - t.high) / (t.top  - t.high));
    if (value >= t.mid)  return lerpColor(RED,    YELLOW,     (value - t.mid)  / (t.high - t.mid));
    return RED;
  }

  function updateSalesColor(value) {
    const el = document.getElementById("salesValue");
    if (!el) return;
    el.style.color = value <= 0 ? "var(--muted)" : "var(--green)";
  }

  async function loadSummary() {
    try {
      const res = await fetch("/api/dashboard/summary");
      if (!res.ok) { console.error("Summary API:", res.status, await res.text()); return; }
      salesData = await res.json();
      countUp("salesValue", salesData.today, formatPHP);
      updateSalesColor(salesData.today);
    } catch (err) { console.error("loadSummary failed:", err); }
  }

  let chartInstance = null;
  const PERIOD_META = {
    daily:   { title: "Sales Last 7 Days"   },
    monthly: { title: "Sales Last 6 Months" },
    yearly:  { title: "Sales Last 5 Years"  },
  };

  async function loadChart(filter) {
    const periodMap = { Daily: "daily", Monthly: "monthly", Yearly: "yearly" };
    const period    = periodMap[filter];
    activePeriod    = period;
    try {
      const res  = await fetch(`/api/dashboard/chart?period=${period}`);
      if (!res.ok) { console.error("Chart API:", res.status); return; }
      const data = await res.json();
      const periodTotal = data.values.reduce((sum, v) => sum + v, 0);
      document.getElementById("chartTitle").textContent = PERIOD_META[period].title;
      countUp("chartPeriodTotal", periodTotal, formatPeriodTotal);
      document.getElementById("chartPlaceholder").style.display = "none";
      document.getElementById("chartWrap").style.display        = "block";
      const ctx    = document.getElementById("salesChart").getContext("2d");
      const colors = data.values.map(v => animColor(v));
      if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
      const barLabelPlugin = {
        id: 'barLabels',
        beforeDatasetsDraw(chart) {
          chart.data.datasets.forEach((dataset, di) => {
            const meta = chart.getDatasetMeta(di);
            meta.data.forEach((bar) => {
              const animVal = chart.scales.y.getValueForPixel(bar.y);
              bar.options.backgroundColor = animColor(animVal);
            });
          });
        },
        afterDatasetsDraw(chart) {
          const ctx2 = chart.ctx;
          ctx2.save();
          chart.data.datasets.forEach((dataset, di) => {
            const meta = chart.getDatasetMeta(di);
            meta.data.forEach((bar) => {
              const animVal = chart.scales.y.getValueForPixel(bar.y);
              if (!animVal || animVal <= 0) return;
              const label = formatBarLabel(animVal);
              ctx2.font         = '700 10px \'DM Sans\', sans-serif';
              ctx2.textAlign    = 'center';
              ctx2.textBaseline = 'bottom';
              ctx2.fillStyle    = animColor(animVal);
              ctx2.fillText(label, bar.x, bar.y - 4);
            });
          });
          ctx2.restore();
        }
      };
      chartInstance = new Chart(ctx, {
        type: "bar",
        data: {
          labels: data.labels,
          datasets: [{
            label:              "Sales (PHP)",
            data:               data.values,
            backgroundColor:    colors,
            borderRadius:       0,
            borderSkipped:      false,
            borderColor:        '#000000',
            borderWidth:        1.0,
            barPercentage:      0.9,
            categoryPercentage: 1.0,
          }]
        },
        plugins: [barLabelPlugin],
        options: {
          responsive:          true,
          maintainAspectRatio: false,
          animation: { duration: 1000, easing: 'easeOutQuart' },
          layout: { padding: { top: 28 } },
          plugins: {
            legend:     { display: false },
            datalabels: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => " ₱ " + Number(ctx.parsed.y).toLocaleString("en-PH", { minimumFractionDigits: 2 })
              }
            }
          },
          scales: {
            x: {
              grid:  { display: false },
              ticks: { font: { family: "'DM Sans', sans-serif", size: 11 }, color: "#6b7280" }
            },
            y: {
              beginAtZero: true,
              grace: '18%',
              grid:  { color: "#f1f5f9" },
              ticks: {
                font: { family: "'DM Sans', sans-serif", size: 11 },
                color: "#6b7280",
                callback: v => "₱" + Number(v).toLocaleString("en-PH")
              }
            }
          }
        }
      });
    } catch (err) { console.error("loadChart failed:", err); }
  }

  const salesTitles = { Daily: "Sales Today", Monthly: "Sales This Month", Yearly: "Sales This Year" };
  const salesKeys   = { Daily: "today", Monthly: "month", Yearly: "year" };

  function setFilter(filter, btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("salesTitle").textContent = salesTitles[filter];
    const val = salesData[salesKeys[filter]];
    countUp("salesValue", val, formatPHP);
    updateSalesColor(val);
    loadChart(filter);
  }

  let transactionData = [];
  let sortKey = null;
  let sortAsc = true;

  async function loadTransactions() {
    const res = await fetch("/api/dashboard/transactions");
    transactionData = await res.json();
    renderTransactions();
  }

  function renderTransactions() {
    const tbody = document.getElementById("tableBody");
    if (!transactionData.length) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="4">No transactions yet.</td></tr>`;
      return;
    }
    let sorted = [...transactionData];
    if (sortKey) {
      sorted.sort((a, b) => {
        let valA = a[sortKey], valB = b[sortKey];
        if (sortKey === "created_at")  { valA = new Date(valA); valB = new Date(valB); }
        else if (sortKey === "quantity") { valA = Number(valA); valB = Number(valB); }
        else if (sortKey === "status") {
          const order = { "In Stock": 1, "Low Stock": 2, "Out of Stock": 3 };
          valA = order[valA] || 99; valB = order[valB] || 99;
        } else { valA = valA?.toString().toLowerCase(); valB = valB?.toString().toLowerCase(); }
        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ?  1 : -1;
        return 0;
      });
    }
    document.querySelectorAll("thead th[data-key]").forEach(th => {
      const key = th.dataset.key, arrow = th.querySelector(".sort-arrow");
      if (arrow) {
        arrow.textContent = key === sortKey ? (sortAsc ? " ▲" : " ▼") : " ⇅";
        th.style.color    = key === sortKey ? "var(--blue-btn)" : "var(--navy)";
      }
    });
    tbody.innerHTML = sorted.map(row => {
      let badge = "";
      if      (row.status === "In Stock")  badge = "background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;";
      else if (row.status === "Low Stock") badge = "background:#fffbeb;color:#eab308;border:1px solid #fde68a;";
      else                                 badge = "background:#fef2f2;color:#dc2626;border:1px solid #fecaca;";
      return `<tr>
        <td class="col-stock">${row.item_name}</td>
        <td class="col-center">${new Date(row.created_at).toLocaleDateString("en-PH")}</td>
        <td class="col-center">${row.quantity}</td>
        <td class="col-center"><span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;${badge}">${row.status}</span></td>
      </tr>`;
    }).join("");
  }

  function sortBy(key) {
    sortAsc = sortKey === key ? !sortAsc : true;
    sortKey = key;
    renderTransactions();
  }

  loadSummary();
  loadChart("Daily");
  loadTransactions();
</script>
</body>
</html>
