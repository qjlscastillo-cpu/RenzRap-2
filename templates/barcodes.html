<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barcodes | Renz Rap Auto Supply</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:      #1e3a8a;
      --blue-btn:  #0056b3;
      --cyan:      #00d4ff;
      --bg:        #d1d5db;
      --card-bg:   #f8fafc;
      --border:    #e5e7eb;
      --text:      #111827;
      --muted:     #6b7280;
      --green:     #16a34a;
      --green-bg:  #f0fdf4;
      --green-bd:  #bbf7d0;
      --red:       #dc2626;
      --red-bg:    #fef2f2;
      --red-bd:    #fecaca;
      --yellow:    #d97706;
      --yellow-bg: #fffbeb;
      --yellow-bd: #fde68a;
      --white:     #ffffff;
    }
    [data-theme="dark"] {
      --bg:      #0f172a;
      --card-bg: #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
      --white:   #1e293b;
      --green:   #4ade80;
      --green-bg:#064e3b; --green-bd:#065f46;
      --red:     #f87171;
      --red-bg:  #7f1d1d; --red-bd:  #991b1b;
      --yellow:  #fbbf24;
      --yellow-bg:#78350f; --yellow-bd:#92400e;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
    }
    .shell {
      display: flex;
      width: 100vw; height: 100vh; min-height: 560px;
      border-radius: 0; overflow: hidden;
      background: var(--white);
    }
    .sidebar-logo {
      font-family: 'Barlow', sans-serif; font-weight: 800; font-size: 17px;
      color: var(--white); margin-bottom: 20px; padding: 0 4px; line-height: 1.3;
      text-align: center;
    }
    .sidebar {
      width: 220px; min-width: 220px;
      background: var(--navy);
      padding: 28px 16px;
      display: flex; flex-direction: column;
      overflow-y: auto;
    }
    .nav-item {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 9px; width: 100%; height: 42px; border-radius: 8px; border: 1px solid transparent;
      background: var(--white); color: var(--navy);
      font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px;
      padding: 0 14px; cursor: pointer; margin-bottom: 8px; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s, border 0.2s;
    }
    .nav-item:hover {
      background: #e8f0fb; border: 1px solid var(--blue-btn);
      transform: translateY(0.5px); box-shadow: 0 4px 12px rgba(91,155,213,0.3);
    }
    .nav-item.active {
      background: var(--blue-btn); color: var(--white);
      border: 2px solid var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.5);
      transform: none; cursor: default;
    }
    .nav-item.active:hover { transform: none; background: var(--blue-btn); }
    .logout-btn { margin-top: auto; color: var(--red); background: var(--white); }
    .logout-btn:hover { background: var(--red-bg); border: 1px solid var(--red); color: var(--red); box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
    .main-wrapper {
      flex: 1; display: flex; flex-direction: column;
      padding: 80px 32px 28px; overflow-y: auto; gap: 16px;
    }
    .page-title {
      font-family: 'Barlow', sans-serif; font-size: 24px; font-weight: 800;
      padding: 14px 20px;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: #fff; border-radius: 14px;
      box-shadow: 0 4px 16px rgba(30,58,138,0.2);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    [data-theme="dark"] .card { box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-weight: 600; font-size: 13px;
      margin-bottom: 6px; color: var(--text);
    }
    .field select, .field input {
      width: 100%; height: 46px; padding: 0 14px;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--white); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field select:focus, .field input:focus {
      border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30,58,138,0.1);
    }
    .btn-row { display: flex; gap: 10px; }
    .btn {
      height: 46px; padding: 0 28px; border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--navy); color: white; }
    .btn-primary:hover { background: #1e40af; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-outline:hover { background: #f1f5f9; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover { filter: brightness(1.1); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover { filter: brightness(1.1); }

    .product-info {
      display: none; margin-top: 20px; padding: 16px 20px;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 12px;
    }
    .product-info.show { display: flex; align-items: center; gap: 16px; }
    .product-info .pi-details { flex: 1; }
    .product-info .pi-name { font-weight: 600; font-size: 15px; color: var(--text); }
    .product-info .pi-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .product-info .pi-badge {
      font-size: 11px; font-weight: 600; padding: 4px 12px;
      border-radius: 999px; white-space: nowrap;
    }
    .pi-badge.has { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
    .pi-badge.none { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }

    .barcode-display {
      margin-top: 24px; padding: 28px;
      border: 2px dashed var(--border); border-radius: 16px;
      text-align: center; display: none;
    }
    .barcode-display.show { display: block; }
    .barcode-display svg { max-width: 300px; height: auto; display: block; margin: 0 auto; }
    .barcode-text {
      font-family: 'Barlow', monospace; font-size: 20px; font-weight: 700;
      letter-spacing: 3px; margin-top: 12px; color: var(--text);
    }
    .barcode-product-label {
      font-size: 13px; color: var(--muted); margin-top: 2px;
    }
    .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }

    .status-msg {
      margin-top: 16px; font-size: 13px; padding: 10px 14px;
      border-radius: 10px; display: none;
    }
    .status-msg.success { display: block; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
    .status-msg.error { display: block; background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 20px; padding: 32px; max-width: 400px; width: 90%;
      text-align: center; box-shadow: 0 16px 48px rgba(0,0,0,0.15);
    }
    .modal-icon { font-size: 40px; margin-bottom: 12px; }
    .modal-title {
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 18px;
      color: var(--text); margin-bottom: 8px;
    }
    .modal-text { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .modal-actions .btn { min-width: 100px; }

    @media print {
      body { background: white; }
      .sidebar, .notif-wrapper, .page-title, .card .field, .card .btn-row, .product-info, .status-msg, .btn-outline, .barcode-grid-card, .bc-search, .main-tab-bar, #paneAll, .bc-gen-btn { display: none !important; }
      .main-wrapper { padding: 20px !important; }
      .card { border: none; padding: 0; box-shadow: none; max-width: 100%; }
      .barcode-display { border: none; display: block !important; padding: 0; }
      .barcode-display svg { max-width: 100%; }
      .actions { display: flex !important; }
    }

    .barcode-grid-card { margin-top: 24px; }
    .bc-card .btn-print { height:34px; padding:0 18px; border:none; border-radius:8px; background:var(--navy); color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background 0.2s; }
    .bc-card .btn-print:hover { background:var(--blue-btn); }
    .main-tab-bar {
      display: flex; gap: 2px; background: var(--white);
      border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); flex-shrink: 0;
    }
    .main-tab-btn {
      flex: 1; height: 44px; border: none; background: transparent;
      font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 14px;
      color: var(--muted); cursor: pointer;
      transition: background 0.15s, color 0.15s;
      border-bottom: 3px solid transparent;
    }
    .main-tab-btn:hover { color: var(--text); background: var(--card-bg); }
    .main-tab-btn.active {
      color: var(--navy); border-bottom-color: var(--navy);
      background: #eff6ff;
    }
    .main-tab-pane { display: none; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
    .main-tab-pane.active { display: flex; }
    .bc-table-img svg { max-width:120px; height:auto; display:block; margin:0 auto; }
    .bc-table-img img { max-width:120px; height:auto; display:block; margin:0 auto; }
    .bc-print-btn { height:32px; padding:0 14px; border:none; border-radius:6px; background:var(--navy); color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background 0.2s; white-space:nowrap; }
    .bc-print-btn:hover { background:var(--blue-btn); }
    .bc-gen-btn { height:32px; padding:0 14px; border:none; border-radius:6px; background:var(--green); color:var(--white); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:background 0.2s; white-space:nowrap; }
    .bc-gen-btn:hover { filter:brightness(1.1); }
    .bc-actions { display:flex; gap:6px; justify-content:center; }
  </style>
</head>
<body>
<div class="shell">
{% include 'sidebar.html' %}
<div class="main-wrapper">

  <div class="page-title">Barcode Generator</div>

  <div class="card" style="padding:24px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <h3 style="font-family:'Barlow',sans-serif;font-size:18px;font-weight:700;color:var(--navy);">All Products</h3>
      <input type="text" id="bcTableSearch" placeholder="Search…" oninput="renderBcTable()" style="height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;background:var(--white);color:var(--text);outline:none;width:220px;"/>
    </div>
    <div style="overflow-y:auto;max-height:500px;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="background:var(--card-bg);">
            <th style="text-align:left;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--border);">Product</th>
            <th style="text-align:left;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--border);">Category</th>
            <th style="text-align:center;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--border);">Barcode</th>
            <th style="text-align:center;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--border);"></th>
            <th style="text-align:center;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--border);">Actions</th>
          </tr>
        </thead>
        <tbody id="bcTableBody"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

  <!-- Toast -->
  <div id="toast" style="
    position:fixed; bottom:30px; right:30px; z-index:99999;Image
    color:#fff; padding:14px 24px;
    border-radius:12px; font-size:14px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.2);
    display:none; align-items:center; gap:10px;
    font-family:'DM Sans',sans-serif;
    animation:toast-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
  ">
    <span id="toastIcon">✅</span>
    <span id="toastMsg"></span>
  </div>
  <style>
  @keyframes toast-in { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
  @keyframes toast-out { from { opacity:1; transform:none; } to { opacity:0; transform:translateY(20px); } }
  </style>

  <div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">Regenerate Barcode?</div>
    <div class="modal-text">This product already has a barcode. Generating a new one will replace it. Continue?</div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn" onclick="doGenerate()">Replace</button>
    </div>
  </div>
</div>

<script>
  let pendingGenId = null;

  loadBcTable();

  // ── All Products Table ───────────────────
  let bcAll = [];

  async function loadBcTable() {
    const res = await fetch('/api/barcodes/products');
    const all = await res.json();
    bcAll = all;
    renderBcTable();
  }

  function renderBcTable() {
    const q = document.getElementById('bcTableSearch').value.toLowerCase();
    const filtered = bcAll.filter(p =>
      p.name.toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q) || (p.barcode||'').includes(q)
    );
    const tbody = document.getElementById('bcTableBody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--muted);font-size:14px;">No products found.</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(p =>
      `<tr>
        <td style="padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;color:var(--text);">${p.name}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--border);color:var(--muted);">${p.category||'—'}</td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--border);text-align:center;font-family:'Barlow',monospace;font-weight:600;letter-spacing:1px;color:var(--text);">${p.barcode || '—'}</td>
        <td class="bc-table-img" style="padding:10px 12px;border-bottom:1px solid var(--border);text-align:center;">
          ${p.barcode ? `<img src="/api/barcodes/${p.barcode}/image" alt="${p.barcode}" style="max-width:120px;height:auto;display:block;margin:0 auto;" onerror="this.outerHTML='<span style=font-size:11px;color:var(--muted)>Error</span>'"/>` : '<span style="font-size:11px;color:var(--muted)">No barcode</span>'}
        </td>
        <td style="padding:10px 12px;border-bottom:1px solid var(--border);text-align:center;">
          <div class="bc-actions">
            <button class="bc-gen-btn" onclick="tableGenerate(${p.id})">Generate</button>
            <button class="bc-print-btn" onclick="${p.barcode ? `printBarcode('${p.barcode}','${p.name.replace(/'/g,"\\'")}')` : 'showToast(\'Generate a barcode first.\',\'warning\')'}">🖨️ Print</button>
          </div>
        </td>
      </tr>`
    ).join('');
  }

  function tableGenerate(id) {
    const p = bcAll.find(x => x.id === id);
    if (!p) return;
    if (p.barcode) {
      pendingGenId = id;
      document.getElementById('confirmModal').classList.add('show');
    } else {
      doGenerate(id);
    }
  }

  function closeConfirm() {
    document.getElementById('confirmModal').classList.remove('show');
    pendingGenId = null;
  }

  async function doGenerate(id) {
    const productId = id || pendingGenId;
    closeConfirm();
    if (!productId) return;
    try {
      const res = await fetch('/api/barcodes/generate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({product_id: productId})
      });
      if (!res.ok) {
        const err = await res.json();
        showToast(err.error || 'Server error', 'error');
        return;
      }
      const data = await res.json();
      showToast(`Barcode ${data.barcode} generated!`, 'success');
      loadBcTable();
    } catch(e) {
      showToast('Error generating barcode.', 'error');
    }
  }

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    const icon = document.getElementById('toastIcon');
    const text = document.getElementById('toastMsg');
    const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    const colors = { success: '#16a34a', error: '#dc2626', info: '#1e3a8a', warning: '#d97706' };
    icon.textContent = icons[type] || '✅';
    el.style.background = colors[type] || '#1e3a8a';
    text.textContent = msg;
    el.style.display = 'flex';
    el.style.animation = 'toast-in 0.3s cubic-bezier(0.34,1.56,0.64,1)';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => {
      el.style.animation = 'toast-out 0.3s ease-in';
      setTimeout(() => el.style.display = 'none', 300);
    }, 3000);
  }

  function printBarcode(code, name) {
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><title>Print Barcode</title><style>
      body{text-align:center;padding:40px;font-family:"DM Sans",sans-serif;background:#fff}
      h3{font-size:16px;margin-bottom:16px;color:#111827}
      img{max-width:280px;height:auto;display:block;margin:0 auto}
      .code{font-family:"Barlow",monospace;font-size:18px;font-weight:700;letter-spacing:3px;margin-top:10px;color:#111827}
      @media print{body{padding:20px}h3{display:none}}
    </style></head><body>
      <h3>${name}</h3>
      <img src="/api/barcodes/${code}/image" alt="Barcode"/>
      <div class="code">${code}</div>
      <script>window.onload=function(){window.print();window.close()}<\/script>
    </body></html>`);
    w.document.close();
  }
</script>
</body>
</html>
