<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Renz Rap Auto Supply — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0e2254; --navy-dark: #09183d; --navy-mid: #163070;
      --cyan: #00d4ff; --cyan-dim: #00b4d8; --bg: #eef1f8;
      --white: #ffffff; --text: #0a192f; --muted: #6b7a94;
      --border: #d0d4df; --input-bg: #f4f6fb;
    }
    [data-theme="dark"] {
      --navy: #0f172a; --bg: #0f172a; --card-bg: #1e293b;
      --border: #334155; --text: #f1f5f9; --muted: #94a3b8;
      --input-bg: #1e293b; --white: #1e293b;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 40%, #80deea 100%);
      font-family: 'Inter', sans-serif; padding: 20px;
    }
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }
    .auth-card {
      background: var(--white); border-radius: 24px; padding: 40px 36px;
      width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      animation: fade-up 0.5s ease both;
    }
    [data-theme="dark"] .auth-card { background: var(--card-bg); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .brand-name-text {
      font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 28px;
      color: #22d3ee; text-align: center; margin-bottom: 4px;
    }
    .brand-name-text span {
      font-size: 20px; font-weight: 600; color: var(--navy); letter-spacing: 1.5px; text-transform: uppercase;
    }
    [data-theme="dark"] .brand-name-text span { color: #f1f5f9; }
    .form-title { text-align: center; margin: 20px 0 24px; }
    .form-title h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 22px; color: var(--navy); }
    [data-theme="dark"] .form-title h2 { color: #f1f5f9; }
    .form-title p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    [data-theme="dark"] .input-group label { color: #cbd5e1; }
    .input-group input {
      width: 100%; height: 44px; padding: 0 14px; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--input-bg); color: var(--text);
      font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--cyan); }
    .btn {
      width: 100%; height: 44px; border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .btn-primary { background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%); color: #fff; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,212,255,0.35); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-link {
      background: none; color: var(--muted); font-size: 13px; margin-top: 8px;
    }
    .btn-link:hover { color: var(--navy); }
    .banner {
      border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 500;
      margin-bottom: 18px; display: none;
    }
    .banner.show { display: block; animation: fade-in 0.22s ease; }
    .banner.error { background: #fff1f0; border: 1px solid #ffc4c0; color: #c0392b; }
    .banner.success { background: #f0fff4; border: 1px solid #b9f0cc; color: #1a7a3c; }
    [data-theme="dark"] .banner.error { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
    [data-theme="dark"] .banner.success { background: #052e16; border-color: #166534; color: #86efac; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; }
    .back-link a { color: var(--muted); text-decoration: none; }
    .back-link a:hover { color: var(--navy); text-decoration: underline; }
    .step { display: none; }
    .step.active { display: block; }
    .theme-toggle {
      position: fixed; top: 16px; right: 16px; width: 36px; height: 36px;
      border-radius: 50%; border: 1px solid var(--border); background: var(--white);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; z-index: 100; transition: background 0.2s;
    }
    .theme-toggle:hover { background: var(--input-bg); }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  <div class="auth-card">
    <div class="brand-name-text">RENZ RAP <span>AUTO SUPPLY</span></div>

    <!-- Step 1: Request reset code -->
    <div class="step active" id="step1">
      <div class="form-title">
        <h2>Forgot Password</h2>
        <p>Enter your username to request a reset code.</p>
      </div>
      <div class="banner error" id="bannerError"></div>
      <div class="banner success" id="bannerSuccess"></div>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="requestBtn" onclick="handleRequest()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Request Reset Code
      </button>
      <div class="back-link"><a href="/">← Back to Login</a></div>
    </div>

    <!-- Step 2: Enter code + new password -->
    <div class="step" id="step2">
      <div class="form-title">
        <h2>Reset Password</h2>
        <p>Enter the code from your admin and your new password.</p>
      </div>
      <div class="banner error" id="resetBannerError"></div>
      <div class="banner success" id="resetBannerSuccess"></div>
      <div class="input-group">
        <label>Reset Code</label>
        <input type="text" id="resetCode" placeholder="6-digit code" maxlength="6" autocomplete="off">
      </div>
      <div class="input-group">
        <label>New Password (max 8 characters)</label>
        <input type="password" id="newPassword" placeholder="Enter new password" maxlength="8">
      </div>
      <button class="btn btn-primary" id="resetBtn" onclick="handleReset()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Reset Password
      </button>
      <div class="back-link"><a href="#" onclick="showStep1();return false;">← Request again</a></div>
    </div>
  </div>

  <script>
    const username = document.getElementById("username");

    function showBanner(el, msg, type) {
      el.textContent = msg;
      el.className = "banner " + type + " show";
    }
    function hideBanners() {
      document.querySelectorAll(".banner").forEach(b => b.className = "banner");
    }
    function showStep1() {
      document.getElementById("step1").classList.add("active");
      document.getElementById("step2").classList.remove("active");
    }

    async function handleRequest() {
      const u = username.value.trim();
      const btn = document.getElementById("requestBtn");
      hideBanners();
      if (!u) { showBanner(document.getElementById("bannerError"), "Please enter your username.", "error"); return; }
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const res = await fetch("/api/forgot-password/request", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u })
        });
        const data = await res.json();
        if (data.success) {
          showBanner(document.getElementById("bannerSuccess"), "Reset code sent to admins!", "success");
          document.getElementById("step1").classList.remove("active");
          document.getElementById("step2").classList.add("active");
        } else {
          btn.disabled = false; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Request Reset Code';
          showBanner(document.getElementById("bannerError"), data.message || "Something went wrong.", "error");
        }
      } catch (e) {
        btn.disabled = false; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Request Reset Code';
        showBanner(document.getElementById("bannerError"), "Network error.", "error");
      }
    }

    async function handleReset() {
      const u = username.value.trim();
      const code = document.getElementById("resetCode").value.trim();
      const newPass = document.getElementById("newPassword").value;
      const btn = document.getElementById("resetBtn");
      hideBanners();
      if (!code || !newPass) { showBanner(document.getElementById("resetBannerError"), "Fill in all fields.", "error"); return; }
      if (newPass.length > 8) { showBanner(document.getElementById("resetBannerError"), "Password max 8 characters.", "error"); return; }
      btn.disabled = true; btn.textContent = "Resetting…";
      try {
        const res = await fetch("/api/forgot-password/reset", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, code, new_password: newPass })
        });
        const data = await res.json();
        if (data.success) {
          showBanner(document.getElementById("resetBannerSuccess"), "Password updated! Redirecting…", "success");
          setTimeout(() => { window.location.href = "/"; }, 1500);
        } else {
          btn.disabled = false; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Reset Password';
          showBanner(document.getElementById("resetBannerError"), data.message, "error");
        }
      } catch (e) {
        btn.disabled = false; btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Reset Password';
        showBanner(document.getElementById("resetBannerError"), "Network error.", "error");
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      document.getElementById("themeBtn").textContent = isDark ? "🌙" : "☀️";
      localStorage.setItem("theme", isDark ? "light" : "dark");
    }
    if (localStorage.getItem("theme") === "dark" || (!localStorage.getItem("theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
      document.getElementById("themeBtn").textContent = "☀️";
    }
  </script>
</body>
</html>
